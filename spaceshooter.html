<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Space Shooter | ZI GAME</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --cyan: #00ffe7;
            --pink: #ff2d78;
            --yellow: #ffe600;
            --purple: #b537f2;
            --orange: #ff7a00;
            --bg: #010109;
        }

        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            cursor: none;
        }

        /* BG */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(130px);
            pointer-events: none;
            animation: orbDrift 22s ease-in-out infinite alternate;
        }

        .o1 {
            width: 700px;
            height: 700px;
            top: -25%;
            left: -18%;
            background: radial-gradient(circle, rgba(0, 90, 255, 0.18), transparent 70%);
        }

        .o2 {
            width: 600px;
            height: 600px;
            bottom: -18%;
            right: -12%;
            background: radial-gradient(circle, rgba(181, 55, 242, 0.16), transparent 70%);
            animation-delay: -11s;
        }

        .o3 {
            width: 400px;
            height: 400px;
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            background: radial-gradient(circle, rgba(0, 255, 231, 0.05), transparent 70%);
            animation-delay: -5s;
            animation-duration: 30s;
        }

        @keyframes orbDrift {
            from { transform: translate(0, 0) }
            to { transform: translate(60px, 100px) }
        }

        /* Grid lines background */
        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(0,255,231,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,231,0.025) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse at center, black 20%, transparent 80%);
        }

        /* SCANLINE */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 999;
            pointer-events: none;
            background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0, 0, 0, 0.04) 3px, rgba(0, 0, 0, 0.04) 4px);
        }

        /* CURSOR */
        .cursor {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            mix-blend-mode: screen;
        }

        .cursor-dot {
            width: 8px;
            height: 8px;
            background: var(--cyan);
            border-radius: 50%;
            margin: -4px 0 0 -4px;
            box-shadow: 0 0 10px var(--cyan), 0 0 25px var(--cyan), 0 0 50px rgba(0,255,231,0.3);
        }

        /* TOPBAR */
        .topbar {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1400px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px 10px;
            gap: 12px;
        }

        .back-btn {
            text-decoration: none;
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 14px;
            border-radius: 8px;
            transition: all 0.25s;
            white-space: nowrap;
            background: rgba(255,255,255,0.02);
            backdrop-filter: blur(10px);
        }

        .back-btn:hover {
            color: var(--cyan);
            border-color: rgba(0, 255, 231, 0.4);
            background: rgba(0, 255, 231, 0.06);
            box-shadow: 0 0 20px rgba(0,255,231,0.1);
        }

        .game-title {
            font-family: 'Syne', sans-serif;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--cyan) 0%, #7b61ff 50%, var(--purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 12px rgba(0,255,231,0.3));
        }

        /* STATUS STRIP */
        .status-strip {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1400px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 24px 10px;
        }

        .sep {
            width: 1px;
            height: 28px;
            background: rgba(255,255,255,0.06);
            flex-shrink: 0;
        }

        /* HUD */
        .hud {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1400px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 0 24px 10px;
        }

        .hud-box {
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .hud-box::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, transparent 60%);
            pointer-events: none;
        }

        .hud-box:nth-child(1) { border-color: rgba(0,255,231,0.15); box-shadow: inset 0 1px 0 rgba(0,255,231,0.08); }
        .hud-box:nth-child(2) { border-color: rgba(255,230,0,0.15); box-shadow: inset 0 1px 0 rgba(255,230,0,0.08); }
        .hud-box:nth-child(3) { border-color: rgba(181,55,242,0.15); box-shadow: inset 0 1px 0 rgba(181,55,242,0.08); }
        .hud-box:nth-child(4) { border-color: rgba(255,45,120,0.15); box-shadow: inset 0 1px 0 rgba(255,45,120,0.08); }

        .hud-label {
            font-family: 'Space Mono', monospace;
            font-size: 8px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.28);
        }

        .hud-val {
            font-family: 'Syne', sans-serif;
            font-size: 20px;
            font-weight: 800;
            line-height: 1;
            transition: transform 0.15s, filter 0.15s;
        }

        .hud-val.score { color: var(--cyan); text-shadow: 0 0 20px rgba(0,255,231,0.4); }
        .hud-val.best  { color: var(--yellow); text-shadow: 0 0 20px rgba(255,230,0,0.3); }
        .hud-val.level { color: var(--purple); text-shadow: 0 0 20px rgba(181,55,242,0.4); }
        .hud-val.lives { color: var(--pink); font-size: 14px; letter-spacing: 2px; }

        .hud-val.score-bump {
            animation: hudBump 0.2s ease;
        }
        @keyframes hudBump {
            0% { transform: scale(1.4); filter: brightness(2); }
            100% { transform: scale(1); filter: brightness(1); }
        }

        /* LEVEL BAR */
        .level-bar-wrap {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1400px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 24px 10px;
        }

        .level-bar-label {
            font-family: 'Space Mono', monospace;
            font-size: 8px;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.22);
            white-space: nowrap;
            text-transform: uppercase;
        }

        .level-bar-track {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 99px;
            overflow: visible;
            position: relative;
        }

        .level-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--cyan), #7b61ff, var(--purple));
            border-radius: 99px;
            transition: width 0.5s cubic-bezier(0.34,1.56,0.64,1);
            width: 0%;
            box-shadow: 0 0 10px rgba(0,255,231,0.5), 0 0 20px rgba(0,255,231,0.2);
            position: relative;
        }

        .level-bar-fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--cyan);
            box-shadow: 0 0 8px var(--cyan), 0 0 16px var(--cyan);
        }

        /* CANVAS */
        .canvas-wrap {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            border-radius: 18px;
            border: 1px solid rgba(0, 255, 231, 0.08);
            box-shadow:
                0 0 0 1px rgba(0, 255, 231, 0.05),
                0 0 40px rgba(0, 80, 255, 0.12),
                0 0 80px rgba(0, 0, 20, 0.6),
                0 30px 100px rgba(0, 0, 0, 0.9),
                inset 0 1px 0 rgba(255,255,255,0.05);
            max-width: 95vw;
            cursor: none;
        }

        /* OVERLAY */
        .overlay {
            position: absolute;
            inset: 0;
            border-radius: 18px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            background: rgba(1, 1, 9, 0.94);
            backdrop-filter: blur(24px);
            z-index: 20;
            overflow: hidden;
        }

        /* Overlay grid */
        .overlay::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,255,231,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,231,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        /* Overlay top/bottom glow lines */
        .overlay::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(0,255,231,0.08) 0px, transparent 60px),
                linear-gradient(0deg, rgba(181,55,242,0.08) 0px, transparent 60px);
            pointer-events: none;
        }

        .overlay.show {
            display: flex;
            animation: overlayIn 0.4s ease both;
        }

        @keyframes overlayIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .ov-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 20px;
        }

        .ov-badge {
            font-family: 'Space Mono', monospace;
            font-size: 9px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--cyan);
            border: 1px solid rgba(0,255,231,0.25);
            padding: 4px 14px;
            border-radius: 99px;
            background: rgba(0,255,231,0.06);
            animation: fadeSlideDown 0.5s 0.1s ease both;
        }

        @keyframes fadeSlideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ov-icon {
            font-size: 72px;
            animation: popIn 0.55s 0.15s cubic-bezier(0.34, 1.56, 0.64, 1) both;
            filter: drop-shadow(0 0 20px rgba(0,255,231,0.5));
            line-height: 1;
        }

        .ov-title {
            font-family: 'Syne', sans-serif;
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #fff 0%, var(--cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeSlideUp 0.5s 0.25s ease both;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ov-divider {
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--cyan), transparent);
            animation: fadeSlideUp 0.5s 0.3s ease both;
        }

        .ov-score {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 3px;
            text-align: center;
            animation: fadeSlideUp 0.5s 0.35s ease both;
        }

        .ov-score span {
            color: var(--cyan);
            font-weight: 700;
        }

        .ov-stats {
            display: flex;
            gap: 20px;
            animation: fadeSlideUp 0.5s 0.4s ease both;
        }

        .ov-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 8px 18px;
        }

        .ov-stat-label {
            font-family: 'Space Mono', monospace;
            font-size: 8px;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.25);
            text-transform: uppercase;
        }

        .ov-stat-val {
            font-family: 'Syne', sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: var(--cyan);
        }

        .ov-btn {
            margin-top: 6px;
            background: linear-gradient(135deg, var(--cyan) 0%, #7b61ff 50%, var(--purple) 100%);
            background-size: 200% 200%;
            color: #000;
            border: none;
            padding: 14px 44px;
            border-radius: 12px;
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 13px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s;
            animation: fadeSlideUp 0.5s 0.5s ease both;
            position: relative;
            overflow: hidden;
        }

        .ov-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
            border-radius: 12px;
        }

        .ov-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 40px rgba(0, 255, 231, 0.4), 0 0 60px rgba(0,255,231,0.15);
        }

        .ov-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .ov-hint {
            font-family: 'Space Mono', monospace;
            font-size: 9px;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.15);
            text-transform: uppercase;
            animation: fadeSlideUp 0.5s 0.55s ease both;
        }

        @keyframes popIn {
            from { transform: scale(0.3) rotate(-10deg); opacity: 0 }
            to { transform: scale(1) rotate(0deg); opacity: 1 }
        }

        /* ABILITY BAR */
        .ability-bar {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
            margin-bottom: 4px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            backdrop-filter: blur(10px);
        }

        .ability-bar-title {
            font-family: 'Space Mono', monospace;
            font-size: 8px;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.2);
            text-transform: uppercase;
            margin-right: 4px;
        }

        .ab-sep {
            width: 1px;
            height: 30px;
            background: rgba(255,255,255,0.06);
        }

        .ability-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            opacity: 0.4;
            transition: opacity 0.25s, transform 0.2s;
        }

        .ability-item.ready {
            opacity: 1;
        }

        .ability-item.ready:hover {
            transform: translateY(-2px);
        }

        .ability-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            position: relative;
            overflow: hidden;
            transition: all 0.25s;
        }

        .ability-item.ready .ability-icon {
            border-color: rgba(0, 255, 231, 0.35);
            background: rgba(0, 255, 231, 0.07);
            box-shadow: 0 0 16px rgba(0, 255, 231, 0.2), inset 0 1px 0 rgba(0,255,231,0.1);
        }

        .ability-item[id="ab-shield"].ready .ability-icon {
            border-color: rgba(0,180,255,0.35);
            background: rgba(0,180,255,0.07);
            box-shadow: 0 0 16px rgba(0,180,255,0.2);
        }

        .ability-item[id="ab-laser"].ready .ability-icon {
            border-color: rgba(255,230,0,0.35);
            background: rgba(255,230,0,0.07);
            box-shadow: 0 0 16px rgba(255,230,0,0.2);
        }

        .ability-cd {
            font-family: 'Space Mono', monospace;
            font-size: 8px;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 1px;
        }

        .ability-item.ready .ability-cd {
            color: rgba(0,255,231,0.7);
        }

        .hint {
            position: relative;
            z-index: 10;
            margin-bottom: 4px;
            font-family: 'Space Mono', monospace;
            font-size: 9px;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.14);
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="bg-layer">
        <div class="orb o1"></div>
        <div class="orb o2"></div>
        <div class="orb o3"></div>
    </div>
    <div class="bg-grid"></div>
    <div class="cursor" id="cursor">
        <div class="cursor-dot"></div>
    </div>

    <!-- TOPBAR -->
    <div class="topbar">
        <a href="index.html" class="back-btn">← BACK</a>
        <div class="game-title">🚀 SPACE SHOOTER</div>
        <div style="width:60px"></div>
    </div>

    <!-- HUD -->
    <div class="hud">
        <div class="hud-box">
            <span class="hud-label">Score</span>
            <span class="hud-val score" id="score">0</span>
        </div>
        <div class="hud-box">
            <span class="hud-label">Best</span>
            <span class="hud-val best" id="best">0</span>
        </div>
        <div class="hud-box">
            <span class="hud-label">Level</span>
            <span class="hud-val level" id="level">1</span>
        </div>
        <div class="hud-box">
            <span class="hud-label">Lives</span>
            <span class="hud-val lives" id="lives">❤️❤️❤️</span>
        </div>
    </div>

    <!-- LEVEL PROGRESS -->
    <div class="level-bar-wrap">
        <span class="level-bar-label">Next Lv</span>
        <div class="level-bar-track">
            <div class="level-bar-fill" id="levelBar"></div>
        </div>
    </div>

    <!-- CANVAS -->
    <div class="canvas-wrap">
        <canvas id="gameCanvas"></canvas>
        <div class="overlay show" id="overlay">
            <div class="ov-content">
                <div class="ov-badge">ZI GAME</div>
                <div class="ov-icon" id="oIcon">🚀</div>
                <div class="ov-title" id="oTitle">SPACE SHOOTER</div>
                <div class="ov-divider"></div>
                <div class="ov-score" id="oScore">Siap mempertahankan galaksi?</div>
                <div class="ov-stats" id="oStats" style="display:none">
                    <div class="ov-stat">
                        <span class="ov-stat-label">Score</span>
                        <span class="ov-stat-val" id="oStatScore">0</span>
                    </div>
                    <div class="ov-stat">
                        <span class="ov-stat-label">Level</span>
                        <span class="ov-stat-val" id="oStatLevel">1</span>
                    </div>
                </div>
                <button class="ov-btn" id="oBtn" onclick="startGame()">MULAI MISI</button>
                <div class="ov-hint" id="oHint">WASD · MOUSE · AUTO-FIRE</div>
            </div>
        </div>
    </div>

    <!-- ABILITIES -->
    <div class="ability-bar">
        <span class="ability-bar-title">Abilities</span>
        <div class="ab-sep"></div>
        <div class="ability-item" id="ab-bomb">
            <div class="ability-icon">💣</div>
            <span class="ability-cd" id="ab-bomb-cd">X — BOMB</span>
        </div>
        <div class="ability-item" id="ab-shield">
            <div class="ability-icon">🛡️</div>
            <span class="ability-cd" id="ab-shield-cd">Z — SHIELD</span>
        </div>
        <div class="ability-item" id="ab-laser">
            <div class="ability-icon">⚡</div>
            <span class="ability-cd" id="ab-laser-cd">C — LASER</span>
        </div>
    </div>

    <div class="hint">WASD / ARROW — Gerak &nbsp;|&nbsp; MOUSE — Arahkan &nbsp;|&nbsp; AUTO-FIRE aktif</div>

    <script>
        // ===== CANVAS SETUP =====
        const cvs = document.getElementById('gameCanvas');
        const ctx = cvs.getContext('2d');
        const overlay = document.getElementById('overlay');

        function getSize() {
            // Take almost all screen space on desktop, removing tight constrictions
            const uiHeight = 180;
            let W = Math.min(window.innerWidth - 32, 1400);
            let H = Math.max(300, window.innerHeight - uiHeight);

            // Give it more vertical proportions on mobile
            if (window.innerWidth <= 768) {
                W = window.innerWidth - 12;
                H = window.innerHeight * 0.55;
            }
            return { W: Math.floor(W), H: Math.floor(H) };
        }
        let { W, H } = getSize();
        cvs.width = W; cvs.height = H;

        window.addEventListener('resize', () => {
            const s = getSize(); W = s.W; H = s.H;
            cvs.width = W; cvs.height = H;
            if (!running) draw();
        });

        // ===== CUSTOM CURSOR =====
        const cursorEl = document.getElementById('cursor');
        document.addEventListener('mousemove', e => {
            cursorEl.style.left = e.clientX + 'px';
            cursorEl.style.top = e.clientY + 'px';
        });

        // ===== STARS (3 layers for parallax depth) =====

                    x: Math.random() * W, y: Math.random() * H,
                    speed: cfg.speed, size: cfg.size, alpha: cfg.alpha,
                    twinkle: Math.random() * Math.PI * 2

        function updateStars() {
            stars.forEach(s => {
                s.y += s.speed;
                s.twinkle += 0.05;

            x: Math.random() * W, y: Math.random() * H,

            color: [`rgba(0,80,200,0.04)`, `rgba(150,0,200,0.04)`, `rgba(0,180,150,0.04)`, `rgba(200,50,100,0.03)`][Math.floor(Math.random() * 4)]
        }));

        function loadBest() {

        // ===== SHIP SHAPE (3D-style) =====
        function drawShip(x, y, scale = 1, alpha = 1) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            const hw = 16, hh = 22;

            // Engine glow (underneath)

            ctx.shadowColor = 'rgba(0,255,231,0.8)'; ctx.shadowBlur = 20;

                ctx.fill();
            });

            const bodyGrad = ctx.createLinearGradient(-hw, -hh, hw, hh);
            bodyGrad.addColorStop(0, '#1a3a6a');
            bodyGrad.addColorStop(0.4, '#0d2244');

            ctx.fillStyle = bodyGrad;

            ctx.moveTo(0, -hh);
            ctx.bezierCurveTo(hw * 0.5, -hh * 0.5, hw, 0, hw * 0.9, hh * 0.6);

            ctx.lineTo(-hw * 0.4, hh);
            ctx.lineTo(-hw * 0.9, hh * 0.6);
            ctx.bezierCurveTo(-hw, 0, -hw * 0.5, -hh * 0.5, 0, -hh);
            ctx.closePath();
            ctx.fill();

            const cockpitGrad = ctx.createRadialGradient(-3, -hh * 0.3, 0, -3, -hh * 0.3, 10);
            cockpitGrad.addColorStop(0, 'rgba(255,255,255,0.8)');
            cockpitGrad.addColorStop(0.3, 'rgba(100,220,255,0.6)');
            cockpitGrad.addColorStop(1, 'rgba(0,80,180,0.2)');
            ctx.fillStyle = cockpitGrad;
            ctx.beginPath();
            ctx.ellipse(0, -hh * 0.2, 6, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-4, -hh + 2);
            ctx.bezierCurveTo(-4, -hh * 0.3, 4, -hh * 0.3, 4, -hh + 2);

                ctx.lineTo(side * hw * 1.5, hh * 0.9);
                ctx.lineTo(side * hw * 1.1, hh);
                ctx.lineTo(side * hw * 0.8, hh * 0.65);

                ctx.lineTo(side * hw * 1.5, hh * 0.9);
                ctx.stroke();

            ctx.shadowColor = 'rgba(0,255,231,0.6)'; ctx.shadowBlur = 12;
            ctx.strokeStyle = 'rgba(0,255,231,0.4)'; ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, -hh);
            ctx.bezierCurveTo(hw * 0.5, -hh * 0.5, hw, 0, hw * 0.9, hh * 0.6);

            ctx.lineTo(-hw * 0.9, hh * 0.6);
            ctx.bezierCurveTo(-hw, 0, -hw * 0.5, -hh * 0.5, 0, -hh);
            ctx.closePath(); ctx.stroke(); ctx.shadowBlur = 0;

            ctx.restore();
        }

        // ===== DRAW ENEMY — FULLY REDESIGNED =====

                ctx.fillStyle = noseG;
                ctx.beginPath();
                ctx.moveTo(0, r*1.04); ctx.lineTo(-r*0.11, r*0.78); ctx.lineTo(r*0.11, r*0.78);
                ctx.closePath(); ctx.fill();

                const ckg = ctx.createRadialGradient(-r*0.05, -r*0.06, 0, 0, -r*0.06, r*0.21);
                ckg.addColorStop(0, 'rgba(230,255,255,0.98)'); ckg.addColorStop(0.4,'rgba(0,255,231,0.65)'); ckg.addColorStop(1,'rgba(0,80,160,0.05)');
                ctx.shadowColor='#00ffe7'; ctx.shadowBlur=14;

                ctx.beginPath(); ctx.ellipse(0,-r*0.06,r*0.1,r*0.21,0,0,Math.PI*2); ctx.fill();

                ctx.strokeStyle='rgba(140,80,255,0.55)'; ctx.lineWidth=1;

            } else if (e.type === 'tank') {

                tSheen.addColorStop(0,'rgba(255,220,120,0.16)'); tSheen.addColorStop(0.5,'rgba(255,180,60,0.05)'); tSheen.addColorStop(1,'rgba(0,0,0,0)');
                ctx.fillStyle=tSheen; ctx.beginPath(); ctx.roundRect(-r*0.5,-r*0.7,r*1.0,r*1.55,r*0.18); ctx.fill();

                [[-r*0.38,-r*0.3],[-r*0.38,r*0.06],[-r*0.38,r*0.32]].forEach(([x,y])=>{

            } else if (e.type === 'boss') {
                // ── BOSS: Dreadnought Carrier ──
                // 3 massive thruster exhausts
                [-r*0.6, 0, r*0.6].forEach((ox,i)=>{
                    const bfG=ctx.createLinearGradient(ox,-r*0.72,ox,-r*2.15*flicker);

                    ctx.fillStyle='rgba(255,80,180,0.1)'; ctx.beginPath(); ctx.roundRect(s*r*0.46,-r*0.64,r*0.48,r*1.32,r*0.13); ctx.fill();

                    const pnG=ctx.createLinearGradient(s*r*0.46,r*0.52,s*r*0.9,r*0.92);

                    ctx.shadowColor='#ff1a7a'; ctx.shadowBlur=12; ctx.fillStyle=pnG;
                    ctx.beginPath(); ctx.moveTo(s*r*0.46,r*0.62); ctx.lineTo(s*r*0.7,r*0.96); ctx.lineTo(s*r*0.94,r*0.62); ctx.closePath(); ctx.fill(); ctx.shadowBlur=0;
                    // Accent ring
                    ctx.strokeStyle='rgba(255,55,145,0.65)'; ctx.lineWidth=1.2;
                    ctx.shadowColor='#ff2d78'; ctx.shadowBlur=7;
                    ctx.beginPath(); ctx.arc(s*r*0.7,-r*0.04,r*0.14,0,Math.PI*2); ctx.stroke(); ctx.shadowBlur=0;
                });

                // Central hull
                const bhG=ctx.createLinearGradient(-r*0.42,0,r*0.42,0);
                bhG.addColorStop(0,'#060010'); bhG.addColorStop(0.25,'#1e0038'); bhG.addColorStop(0.5,'#380060'); bhG.addColorStop(0.75,'#1e0038'); bhG.addColorStop(1,'#060010');
                ctx.fillStyle=bhG; ctx.beginPath(); ctx.roundRect(-r*0.42,-r*0.8,r*0.84,r*1.68,r*0.14); ctx.fill();
                ctx.fillStyle='rgba(200,80,255,0.1)'; ctx.beginPath(); ctx.roundRect(-r*0.42,-r*0.8,r*0.84,r*1.68,r*0.14); ctx.fill();

                // Hull circuit lines
                ctx.shadowColor='#ff2d78'; ctx.shadowBlur=7; ctx.strokeStyle='rgba(255,55,145,0.75)'; ctx.lineWidth=1.5;
                [[-r*0.3,-r*0.52],[-r*0.3,-r*0.16],[-r*0.3,r*0.2],[-r*0.3,r*0.52]].forEach(([x,y])=>{
                    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(-x,y); ctx.stroke();
                }); ctx.shadowBlur=0;

                // Main nose
                const cnG=ctx.createLinearGradient(-r*0.42,r*0.62,r*0.42,r*1.28);
                cnG.addColorStop(0,'#c50080'); cnG.addColorStop(0.5,'#ff2d78'); cnG.addColorStop(1,'#620040');
                ctx.shadowColor='#ff2d78'; ctx.shadowBlur=20; ctx.fillStyle=cnG;
                ctx.beginPath(); ctx.moveTo(-r*0.42,r*0.72); ctx.lineTo(0,r*1.3); ctx.lineTo(r*0.42,r*0.72); ctx.closePath(); ctx.fill(); ctx.shadowBlur=0;

                // Pulsing energy core
                const pulse=0.6+Math.sin(t*5)*0.4;
                const coreG=ctx.createRadialGradient(-r*0.1,-r*0.1,0,0,0,r*0.33);
                coreG.addColorStop(0,`rgba(255,255,255,${0.92*pulse})`); coreG.addColorStop(0.3,`rgba(0,255,231,${0.8*pulse})`); coreG.addColorStop(0.7,`rgba(0,140,255,${0.28*pulse})`); coreG.addColorStop(1,'rgba(0,0,80,0)');
                ctx.shadowColor='#00ffe7'; ctx.shadowBlur=26*pulse; ctx.fillStyle=coreG;
                ctx.beginPath(); ctx.arc(0,0,r*0.33,0,Math.PI*2); ctx.fill();
                ctx.strokeStyle=`rgba(0,255,231,${0.92*pulse})`; ctx.lineWidth=2.5;
                ctx.beginPath(); ctx.arc(0,0,r*0.38,0,Math.PI*2); ctx.stroke(); ctx.shadowBlur=0;

                // HP bar (rounded, glowing)
                const hpPct=Math.max(0,e.hp/e.maxHp);
                const bW=r*2.6,bH=7,bX=-r*1.3,bY=-r*1.92;
                ctx.fillStyle='rgba(0,0,0,0.72)'; ctx.beginPath(); ctx.roundRect(bX,bY,bW,bH,bH/2); ctx.fill();
                const barC=hpPct>0.5?'#00ffe7':hpPct>0.25?'#ffe600':'#ff2d78';
                ctx.shadowColor=barC; ctx.shadowBlur=9; ctx.fillStyle=barC;
                ctx.beginPath(); ctx.roundRect(bX,bY,bW*hpPct,bH,bH/2); ctx.fill(); ctx.shadowBlur=0;
                ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.font=`bold ${r*0.21}px monospace`; ctx.textAlign='center';
                ctx.fillText('BOSS',0,bY-4);
            }

            ctx.shadowBlur = 0;
            ctx.restore();
        }

        // ===== EXPLOSION EFFECT =====
        class Explosion {
            constructor(x, y, r, color = '#ff7a00') {
                this.x = x; this.y = y; this.maxR = r; this.r = 0;
                this.alpha = 1; this.color = color; this.rings = [];
                for (let i = 0; i < 3; i++) this.rings.push({ r: 0, speed: r * 0.04 * (i + 1), alpha: 0.6 - i * 0.15 });
            }
            update() {
                this.r += this.maxR * 0.06; this.alpha -= 0.06;
                this.rings.forEach(rg => { rg.r += rg.speed; rg.alpha -= 0.04; });
                return this.alpha > 0;
            }
            draw() {
                ctx.save(); ctx.globalAlpha = Math.max(0, this.alpha);
                // Core flash
                const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r);
                g.addColorStop(0, 'rgba(255,255,255,0.9)');
                g.addColorStop(0.3, this.color + 'cc');
                g.addColorStop(1, 'transparent');
                ctx.fillStyle = g; ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill();
                // Shock rings
                this.rings.forEach(rg => {
                    ctx.globalAlpha = Math.max(0, rg.alpha);
                    ctx.strokeStyle = this.color; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(this.x, this.y, rg.r, 0, Math.PI * 2); ctx.stroke();
                });
                ctx.restore();
            }
        }

        // ===== BULLET TYPES =====
        function spawnBullet(type = 'normal') {
            const cx = ship.x;

            if (type === 'normal') {
                bullets.push({ x: cx, y: cy, vx: 0, vy: -10, type: 'normal', w: 3, h: 14, color: '#7b61ff' });
            } else if (type === 'spread') {
                for (let a of [-0.3, 0, 0.3]) {
                    bullets.push({ x: cx, y: cy, vx: Math.sin(a) * 8, vy: Math.cos(a) * -10, type: 'spread', w: 3, h: 10, color: '#00ffe7' });
                }
            } else if (type === 'laser') {
                // laser handled separately
            }
        }

        // ===== SPAWN POWERUP =====
        function spawnPowerup(x, y) {
            const types = [
                { id: 'bomb', icon: '💣', color: '#00ffe7', txt: 'BOMB READY!' },

        // ===== ENEMY TYPES & BOSS CONFIG =====
        const BOSS_DEFS = [
            { name: 'THE DESTROYER', hp: 30, sz: 70, sp: 0.6, color: '#ff2d78', rings: 4, bulletSpd: 4, spiralCd: 35, phase2Mul: 1.5, emoji: '💀' },
            { name: 'IRON LEVIATHAN', hp: 55, sz: 85, sp: 0.45, color: '#ff9a00', rings: 6, bulletSpd: 3.5, spiralCd: 28, phase2Mul: 1.8, emoji: '🤖' },
            { name: 'VOID EMPEROR', hp: 90, sz: 100, sp: 0.35, color: '#b537f2', rings: 8, bulletSpd: 3.2, spiralCd: 22, phase2Mul: 2.0, emoji: '👾' },
        ];
        let bossWarnTimer = 0; // boss entrance warning
        let waveEnemyCount = 0; // total enemies left this wave

        // ===== SPAWN ENEMY =====
        function spawnEnemy() {
            // Cap active enemies to avoid overwhelming lag — scale cap with level
            const maxEnemies = Math.min(25 + level * 3, 80);
            if (enemies.filter(e => !e.dead).length >= maxEnemies) return;

            // Boss spawn: every 5 levels guarantee 1 boss, no duplicate
            if (level % 5 === 0 && frame % 900 === 0 && !enemies.some(e => e.type === 'boss')) {
                spawnBossEnemy();
                return;
            }

            // Choose type with weighted probability by level
            let type;
            const r = Math.random();
            if (level < 3) {
                type = r < 0.6 ? 'fighter' : (r < 0.85 ? 'scout' : 'tank');
            } else if (level < 7) {
                type = r < 0.35 ? 'fighter' : (r < 0.55 ? 'scout' : (r < 0.72 ? 'tank' : (r < 0.88 ? 'drone' : 'speeder')));
            } else {
                type = r < 0.25 ? 'fighter' : (r < 0.4 ? 'scout' : (r < 0.55 ? 'tank' : (r < 0.68 ? 'drone' : (r < 0.8 ? 'speeder' : (r < 0.92 ? 'stealth' : 'elite')))));
            }

            doSpawnEnemy(type);
        }

        function doSpawnEnemy(type) {
            const edge = Math.floor(Math.random() * 4); // 0=top,1=right,2=left — enemies come from all edges at high levels
            let ex = Math.random() * (W - 40) + 20;
            let ey;
            if (level < 4 || edge === 0) {
                ey = -40 - Math.random() * 80;
            } else if (edge === 1) {
                ex = W + 40; ey = Math.random() * H * 0.65;
            } else if (edge === 2) {
                ex = -40; ey = Math.random() * H * 0.65;
            } else {
                ey = -40 - Math.random() * 80;
            }

            const wMul = 1 + (level - 1) * 0.12; // scale with level

            const configs = {
                fighter: { sz: 28, sp: 1.8 + level * 0.15, hp: 1, vxRange: 0.4, color: '#ff2d78' },
                scout:   { sz: 20, sp: 2.5 + level * 0.22, hp: 1, vxRange: 1.6, color: '#b537f2' },
                tank:    { sz: 38, sp: 1.1 + level * 0.09, hp: Math.ceil(3 * wMul), vxRange: 0.3, color: '#ff9a00' },
                drone:   { sz: 22, sp: 2.0 + level * 0.18, hp: 1, vxRange: 2.0, color: '#00ffe7' },
                speeder: { sz: 18, sp: 4.0 + level * 0.28, hp: 1, vxRange: 0.8, color: '#ffe600' },
                stealth: { sz: 24, sp: 1.6 + level * 0.14, hp: 2, vxRange: 0.5, color: '#69ff47' },
                elite:   { sz: 36, sp: 1.5 + level * 0.12, hp: Math.ceil(5 * wMul), vxRange: 0.3, color: '#ff4500' },
            };
            const cfg = configs[type] || configs.fighter;

            const e = {
                x: ex, y: ey,
                w: cfg.sz, h: cfg.sz, type,
                sp: cfg.sp, hp: cfg.hp, maxHp: cfg.hp,
                rot: 0, rotSpeed: (Math.random() - 0.5) * 0.04,
                vx: (Math.random() - 0.5) * cfg.vxRange,
                shootTimer: Math.random() * 120,
                stealthAlpha: 1,
                dead: false,
            };
            enemies.push(e);
        }

        function spawnBossEnemy() {
            const bIdx = Math.floor((level / 5 - 1)) % BOSS_DEFS.length;
            const def = BOSS_DEFS[Math.max(0, bIdx)];
            const lvlMul = 1 + (level / 5 - 1) * 0.6; // boss gets stronger each cycle
            enemies.push({
                x: W / 2 - def.sz / 2, y: -def.sz - 20,
                w: def.sz, h: def.sz, type: 'boss',
                sp: def.sp, hp: Math.round(def.hp * lvlMul), maxHp: Math.round(def.hp * lvlMul),
                rot: 0, rotSpeed: 0.008,
                bulletSpd: def.bulletSpd, spiralCd: def.spiralCd,
                shootTimer: 0, spiralAngle: 0,
                phase2: false, phase2Mul: def.phase2Mul,
                bossName: def.name, bossEmoji: def.emoji, bossColor: def.color,
                rings: def.rings,
                dead: false,
            });
            // Show boss entrance text
            floatingTexts.push({ x: W / 2, y: H * 0.35, text: `⚠️ ${def.emoji} ${def.name} ⚠️`, color: def.color, alpha: 1, vy: -0.3, size: 22, duration: 180 });
        }

        // Formation spawner — called every N frames at higher levels
        function spawnFormation() {
            if (level < 5) return;
            const formations = ['vee', 'line', 'pincer'];
            const f = formations[Math.floor(Math.random() * formations.length)];
            if (f === 'vee') {
                for (let i = 0; i < 5; i++) {
                    const ox = (i - 2) * 36;
                    const oy = Math.abs(i - 2) * 28;
                    setTimeout(() => doSpawnEnemyAt('fighter', W/2 + ox, -60 - oy), i * 80);
                }
            } else if (f === 'line') {
                const type = level >= 8 ? 'drone' : 'fighter';
                for (let i = 0; i < 6; i++) {
                    setTimeout(() => doSpawnEnemyAt(type, (i + 1) * W / 7, -50), i * 100);
                }
            } else { // pincer
                for (let i = 0; i < 3; i++) {
                    setTimeout(() => { doSpawnEnemyAt('scout', -40, 80 + i * 60); doSpawnEnemyAt('scout', W + 40, 80 + i * 60); }, i * 120);
                }
            }
        }

        function doSpawnEnemyAt(type, x, y) {
            const wMul = 1 + (level - 1) * 0.12;
            const configs = {
                fighter: { sz: 28, sp: 1.8 + level * 0.15, hp: 1, vxRange: 0.4 },
                scout:   { sz: 20, sp: 2.5 + level * 0.22, hp: 1, vxRange: 1.2 },
                drone:   { sz: 22, sp: 2.0 + level * 0.18, hp: 1, vxRange: 2.0 },
            };
            const cfg = configs[type] || configs.fighter;
            enemies.push({
                x, y, w: cfg.sz, h: cfg.sz, type,
                sp: cfg.sp, hp: cfg.hp, maxHp: cfg.hp,
                rot: 0, rotSpeed: (Math.random() - 0.5) * 0.04,
                vx: (Math.random() - 0.5) * cfg.vxRange,
                shootTimer: Math.random() * 80,
                stealthAlpha: 1, dead: false,
            });
        }

        // ===== ENEMY BULLET =====
        let eBullets = [];

        // ===== PARTICLES =====
        function spawnParticles(x, y, color, count = 12, speed = 3) {
            for (let i = 0; i < count; i++) {
                const a = Math.random() * Math.PI * 2;
                const sp = Math.random() * speed + 1;
                particles.push({
                    x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                    r: Math.random() * 2.5 + 0.8, alpha: 1, color, decay: 0.04 + Math.random() * 0.03
                });
            }
        }

        // ===== BOMB ABILITY =====
        function useBomb() {
            if (bombCd > 0) return;
            bombCd = 300;
            enemies.forEach(e => {
                if (!e.dead) {
                    explosions.push(new Explosion(e.x + e.w / 2, e.y + e.h / 2, e.w * 1.5, '#ff9a00'));
                    spawnParticles(e.x + e.w / 2, e.y + e.h / 2, '#ff9a00', 16);
                    addScore(e.hp * 10); e.dead = true;
                }
            });
            eBullets = [];
        }

        // ===== SHIELD ABILITY =====
        function useShield() {
            if (shieldCd > 0) return;
            shieldActive = true; shieldTimer = 180; shieldCd = 400;
        }

        // ===== LASER ABILITY =====
        function useLaser() {
            if (laserCd > 0) return;
            laserActive = true; laserTimer = 90; laserCd = 350;
        }

        // ===== SCORE / LEVEL =====
        let nextLevelScore = 100;
        function addScore(amt) {
            score += (score2xTimer > 0) ? amt * 2 : amt;
            updateScore();
        }
        function updateScore() {
            const scoreEl = document.getElementById('score');
            scoreEl.textContent = score;
            scoreEl.classList.remove('score-bump');
            void scoreEl.offsetWidth; // reflow
            scoreEl.classList.add('score-bump');
            const lvlEl = document.getElementById('level');
            const bar = document.getElementById('levelBar');
            lvlEl.textContent = level;
            const prev = (level - 1) * 100, range = nextLevelScore - prev;
            const pct = Math.min(100, ((score - prev) / range) * 100);
            bar.style.width = pct + '%';
            if (score >= nextLevelScore) {
                level++;
                nextLevelScore = Math.floor(nextLevelScore * 1.6);
                lvlEl.textContent = level;
                // Level-up flash
                explosions.push(new Explosion(W / 2, H / 2, W * 0.4, '#00ffe7'));
            }
        }

        // ===== MAIN GAME =====
        function startGame() {
            ship = { x: W / 2, y: H * 0.78 };
            bullets = []; enemies = []; particles = []; explosions = []; eBullets = []; powerups = []; floatingTexts = [];
            score = 0; lives = 3; level = 1; frame = 0; running = true;
            bombCd = 0; shieldCd = 0; laserCd = 0;
            shieldActive = false; shieldTimer = 0;
            laserActive = false; laserTimer = 0;
            invulTimer = 0; nextLevelScore = 100;
            rapidFireTimer = 0; multiTimer = 0; slowTimer = 0; score2xTimer = 0;
            document.getElementById('level').textContent = 1;
            document.getElementById('levelBar').style.width = '0%';
            // Reset overlay to start state
            document.getElementById('oIcon').textContent = '🚀';
            document.getElementById('oTitle').textContent = 'SPACE SHOOTER';
            document.getElementById('oScore').textContent = 'Siap mempertahankan galaksi?';
            document.getElementById('oStats').style.display = 'none';
            document.getElementById('oBtn').textContent = 'MULAI MISI';
            document.getElementById('oHint').textContent = 'WASD · MOUSE · AUTO-FIRE';
            updateScore();
            updateLivesDisplay();
            overlay.classList.remove('show');
            if (animId) cancelAnimationFrame(animId);
            lastTs = 0;
            loop();
        }

        function updateLivesDisplay() {
            document.getElementById('lives').textContent = '❤️'.repeat(Math.max(0, lives));
        }

        const STEP = 1000 / 60;
        function loop(ts = 0) {
            if (!running) return;
            animId = requestAnimationFrame(loop);
            const dt = ts - lastTs;
            if (dt < STEP - 2) return;
            lastTs = ts;
            frame++;
            update();
            draw();
        }

        function update() {
            // Input: keyboard
            const spd = 4.5;
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) ship.x -= spd;
            if (keys['ArrowRight'] || keys['d'] || keys['D']) ship.x += spd;
            if (keys['ArrowUp'] || keys['w'] || keys['W']) ship.y -= spd * 0.8;
            if (keys['ArrowDown'] || keys['s'] || keys['S']) ship.y += spd * 0.8;
            // Mouse attraction (gentle)
            if (mouseX > 0) {
                const dx = mouseX - ship.x, dy = mouseY - (ship.y);
                ship.x += dx * 0.06; ship.y += dy * 0.04;
            }
            ship.x = Math.max(18, Math.min(W - 18, ship.x));
            ship.y = Math.max(H * 0.45, Math.min(H - 22, ship.y));

            // Auto shoot
            let fireRate = Math.max(6, 14 - level);
            if (rapidFireTimer > 0) fireRate = Math.max(3, fireRate / 2.5); // shoot much faster

            if (frame % Math.floor(fireRate) === 0) {
                if (multiTimer > 0) {
                    [-0.4, -0.2, 0, 0.2, 0.4].forEach(a => {
                        bullets.push({ x: ship.x, y: ship.y - 22, vx: Math.sin(a) * 9, vy: Math.cos(a) * -11, type: 'spread', w: 3, h: 10, color: '#a000ff' });
                    });
                } else if (level >= 3) {
                    spawnBullet('spread');
                } else {
                    spawnBullet('normal');
                }
            }

            // Laser beam
            if (laserActive) {
                laserTimer--;
                if (laserTimer <= 0) laserActive = false;
                enemies.forEach(e => {
                    if (!e.dead && e.x < ship.x + 10 && e.x + e.w > ship.x - 10) {
                        e.hp -= 0.5;
                        if (e.hp <= 0) { addScore(e.maxHp * 10); e.dead = true; explosions.push(new Explosion(e.x + e.w / 2, e.y + e.h / 2, e.w * 1.2, '#00ffe7')); }
                        spawnParticles(ship.x, e.y + e.h, '#00ffe7', 2);
                    }
                });
            }

            // Shield timer
            if (shieldTimer > 0) { shieldTimer--; if (shieldTimer <= 0) shieldActive = false; }
            if (invulTimer > 0) invulTimer--;

            // Cooldowns
            if (bombCd > 0) bombCd--;
            if (shieldCd > 0) shieldCd--;
            if (laserCd > 0) laserCd--;
            updateAbilityUI();

            // Spawn rate scales aggressively with level — enemies never stop
            const spawnRate = Math.max(12, 55 - level * 4);
            if (frame % spawnRate === 0) spawnEnemy();
            // Formation spawns every 8s from level 5+
            if (level >= 5 && frame % 480 === 0) spawnFormation();
            // Extra burst at higher levels
            if (level >= 10 && frame % (spawnRate * 2) === 0) spawnEnemy();
            if (level >= 15 && frame % (spawnRate * 3) === 0) spawnEnemy();

            // Update bullets
            bullets.forEach(b => { b.x += b.vx; b.y += b.vy; });
            bullets = bullets.filter(b => b.y > -20 && b.x > -10 && b.x < W + 10);

            // Active Timers
            if (rapidFireTimer > 0) rapidFireTimer--;
            if (multiTimer > 0) multiTimer--;
            if (slowTimer > 0) slowTimer--;
            if (score2xTimer > 0) score2xTimer--;

            const tScale = (slowTimer > 0) ? 0.35 : 1;

            // Update enemy bullets
            eBullets.forEach(b => { b.x += b.vx * tScale; b.y += b.vy * tScale; });
            eBullets = eBullets.filter(b => b.y < H + 10 && b.y > -10 && b.x > -10 && b.x < W + 10);

            // Update enemies
            enemies.forEach(e => {
                e.y += e.sp * tScale;
                e.x += (e.vx || 0) * tScale;
                e.rot += (e.rotSpeed || 0) * tScale;
                // Bounce walls
                if (e.x < 0) { e.x = 0; e.vx = Math.abs(e.vx || 0); }
                if (e.x + e.w > W) { e.x = W - e.w; e.vx = -Math.abs(e.vx || 0); }
                // Enemy shooting (tank, boss, elite, drone)
                if (e.type === 'tank' || e.type === 'boss' || e.type === 'elite' || e.type === 'drone') {
                    e.shootTimer = (e.shootTimer || 0) + 1 * tScale;
                    const fireInterval = e.type === 'boss' ? (e.spiralCd || 40) : e.type === 'elite' ? 60 : e.type === 'drone' ? 70 : 80;
                    if (e.shootTimer >= fireInterval) {
                        e.shootTimer = 0;
                        const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
                        const dx = ship.x - cx, dy = ship.y - cy;
                        const dist = Math.hypot(dx, dy) || 1;
                        if (e.type === 'boss') {
                            // Spiral shot pattern
                            e.spiralAngle = (e.spiralAngle || 0) + 0.4;
                            const rings = e.rings || 4;
                            for (let a = 0; a < rings; a++) {
                                const ba = e.spiralAngle + (a / rings) * Math.PI * 2;
                                const bspd = e.bulletSpd || 4;
                                eBullets.push({ x: cx, y: cy, vx: Math.cos(ba) * bspd, vy: Math.sin(ba) * bspd, r: 5, color: e.bossColor || '#ff9a00' });
                            }
                            // Phase 2: aimed burst too
                            if (e.phase2) {
                                for (let i = -1; i <= 1; i++) {
                                    eBullets.push({ x: cx, y: cy, vx: (dx / dist + i * 0.25) * 5, vy: (dy / dist) * 5, r: 4, color: '#ffe600' });
                                }
                            }
                        } else if (e.type === 'elite') {
                            // Triple shot spread
                            for (let i = -1; i <= 1; i++) {
                                eBullets.push({ x: cx, y: cy, vx: (dx / dist + i * 0.3) * 3.5, vy: (dy / dist + i * 0.15) * 3.5, r: 4, color: '#ff4500' });
                            }
                        } else if (e.type === 'drone') {
                            // Aimed shot
                            eBullets.push({ x: cx, y: cy, vx: dx / dist * 4.5, vy: dy / dist * 4.5, r: 3, color: '#00ffe7' });
                        } else {
                            // Tank: aimed shot
                            eBullets.push({ x: cx, y: cy, vx: dx / dist * 2.5, vy: dy / dist * 2.5, r: 4, color: '#ff9a00' });
                        }
                    }
                }
                // Stealth: fade in/out
                if (e.type === 'stealth') {
                    const cycle = Math.sin(frame * 0.04 + e.x) * 0.5 + 0.5;
                    e.stealthAlpha = 0.15 + cycle * 0.85;
                }
                // Boss phase 2 trigger at 50% HP
                if (e.type === 'boss' && !e.phase2 && e.hp <= e.maxHp * 0.5) {
                    e.phase2 = true;
                    e.sp *= e.phase2Mul || 1.5;
                    e.spiralCd = Math.max(15, (e.spiralCd || 40) - 10);
                    floatingTexts.push({ x: W / 2, y: H * 0.4, text: '⚠️ PHASE 2 ⚠️', color: '#ffe600', alpha: 1, vy: -0.5, size: 20, duration: 120 });
                    explosions.push(new Explosion(e.x + e.w / 2, e.y + e.h / 2, e.w * 2, e.bossColor || '#ff2d78'));
                }
                // Bullet collision
                bullets.forEach((b, bi) => {
                    const bx = b.x, by = b.y;
                    if (bx > e.x && bx < e.x + e.w && by > e.y && by < e.y + e.h) {
                        e.hp--; bullets.splice(bi, 1);
                        spawnParticles(bx, by, e.type === 'tank' ? '#ff9a00' : '#ff2d78', 5, 2);
                if (e.hp <= 0) {
                            addScore(e.maxHp * (e.type === 'boss' ? 20 : e.type === 'elite' ? 15 : 10));
                            explosions.push(new Explosion(e.x + e.w / 2, e.y + e.h / 2, e.w * 1.5, e.type === 'boss' ? (e.bossColor || '#ffe600') : '#ff7a00'));
                            spawnParticles(e.x + e.w / 2, e.y + e.h / 2, e.type === 'boss' ? (e.bossColor || '#ff2d78') : '#ff2d78', e.type === 'boss' ? 35 : 20, 5);
                            e.dead = true;
                            // Drop powerup — boss always drops, others 18%
                            if (e.type === 'boss' || e.type === 'elite' || Math.random() < 0.18) {
                                spawnPowerup(e.x + e.w / 2, e.y + e.h / 2);
                            }
                            if (e.type === 'boss') {
                                floatingTexts.push({ x: W/2, y: H/2 - 40, text: `${e.bossEmoji || '💀'} BOSS DEFEATED!`, color: e.bossColor || '#ffe600', alpha: 1, vy: -0.6, size: 24, duration: 200 });
                            }
                        }
                    }
                });
                // Ship collision
                if (!e.dead && invulTimer <= 0 && !shieldActive) {
                    const ex = e.x + e.w / 2, ey = e.y + e.h / 2;
                    if (Math.abs(ex - ship.x) < e.w * 0.45 + 14 && Math.abs(ey - ship.y) < e.h * 0.45 + 20) {
                        takeDamage(); e.dead = true;
                        explosions.push(new Explosion(e.x + e.w / 2, e.y + e.h / 2, e.w, '#ff2d78'));
                    }
                }
            });

            // Enemy bullet hit ship
            if (invulTimer <= 0 && !shieldActive) {
                eBullets.forEach((b, bi) => {
                    if (Math.abs(b.x - ship.x) < 16 && Math.abs(b.y - ship.y) < 22) {
                        eBullets.splice(bi, 1); takeDamage();
                    }
                });
            } else if (shieldActive) {
                eBullets = eBullets.filter(b => {
                    if (Math.abs(b.x - ship.x) < 50 && Math.abs(b.y - ship.y) < 50) {
                        spawnParticles(b.x, b.y, '#00ffe7', 6, 3); return false;
                    }
                    return true;
                });
            }

            enemies = enemies.filter(e => !e.dead && e.y < H + 120 && e.x > -120 && e.x < W + 120);

            // Powerups
            powerups.forEach(p => {
                p.y += p.vy;
                p.rot += 0.03;
                if (!p.collected && invulTimer <= 0) {
                    if (Math.hypot(p.x - ship.x, p.y - ship.y) < 36) {
                        p.collected = true;
                        if (p.type === 'bomb') bombCd = 0;
                        else if (p.type === 'shield') shieldCd = 0;
                        else if (p.type === 'laser') laserCd = 0;
                        else if (p.type === 'rapid') rapidFireTimer = 300; // 5s
                        else if (p.type === 'multi') multiTimer = 400; // 6.6s
                        else if (p.type === 'slow') slowTimer = 480; // 8s
                        else if (p.type === 'score2x') score2xTimer = 600; // 10s
                        else if (p.type === 'nuke') {
                            enemies.forEach(e => {
                                if(!e.dead) {
                                    e.dead = true;
                                    addScore(e.maxHp * 15);
                                    explosions.push(new Explosion(e.x + e.w / 2, e.y + e.h / 2, e.w * 2, '#ff2d78'));
                                }
                            });
                            eBullets = [];
                            explosions.push(new Explosion(W/2, H/2, W*0.8, '#ff2d78')); // Massive screen flash
                        }
                        else if (p.type === 'life') {
                            lives = Math.min(lives + 1, 5);
                            updateLivesDisplay();
                        }
                        spawnParticles(p.x, p.y, p.color, 15, 4);
                        floatingTexts.push({ x: p.x, y: p.y, text: p.txt, color: p.color, alpha: 1, vy: -1.2 });
                        updateAbilityUI();
                        if(typeof SoundEngine !== 'undefined') SoundEngine.play('powerup');
                    }
                }
            });
            powerups = powerups.filter(p => !p.collected && p.y < H + 30);

            // Floating texts
            floatingTexts.forEach(ft => {
                ft.y += ft.vy;
                ft.alpha -= ft.duration ? (1 / ft.duration) : 0.012;
            });
            floatingTexts = floatingTexts.filter(ft => ft.alpha > 0);

            // Particles
            particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vx *= 0.93; p.vy *= 0.93; p.alpha -= p.decay; });
            particles = particles.filter(p => p.alpha > 0.01);

            // Explosions
            explosions = explosions.filter(ex => ex.update());
        }

        function takeDamage() {
            lives--;
            updateLivesDisplay();
            spawnParticles(ship.x, ship.y, '#ff2d78', 18, 4);
            invulTimer = 120;
            if (lives <= 0) endGame();
        }

        function updateAbilityUI() {
            const items = [
                { id: 'ab-bomb', cd: bombCd, max: 300, cdId: 'ab-bomb-cd', label: 'X — BOMB' },
                { id: 'ab-shield', cd: shieldCd, max: 400, cdId: 'ab-shield-cd', label: 'Z — SHIELD' },
                { id: 'ab-laser', cd: laserCd, max: 350, cdId: 'ab-laser-cd', label: 'C — LASER' },
            ];
            items.forEach(ab => {
                const el = document.getElementById(ab.id);
                const cdEl = document.getElementById(ab.cdId);
                if (ab.cd > 0) {
                    el.classList.remove('ready');
                    cdEl.textContent = Math.ceil(ab.cd / 60) + 's';
                } else {
                    el.classList.add('ready');
                    cdEl.textContent = ab.label;
                }
            });
        }

        // ===== DRAW =====
        function draw() {
            ctx.fillStyle = '#01010c'; ctx.fillRect(0, 0, W, H);

            // Nebulae
            nebulae.forEach(n => {
                const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
                g.addColorStop(0, n.color); g.addColorStop(1, 'transparent');
                ctx.fillStyle = g; ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2); ctx.fill();
            });

            updateStars(); drawStars();

            // Explosions (behind enemies)
            explosions.forEach(ex => ex.draw());

            // Enemy bullets
            eBullets.forEach(b => {
                ctx.save(); ctx.shadowColor = b.color; ctx.shadowBlur = 12;
                ctx.fillStyle = b.color;
                ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            });

            // Enemies
            enemies.forEach(e => drawEnemy(e));

            // Player bullets
            bullets.forEach(b => {
                ctx.save();
                ctx.shadowColor = b.color; ctx.shadowBlur = 10;
                const g = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
                g.addColorStop(0, 'rgba(255,255,255,0.9)');
                g.addColorStop(0.4, b.color);
                g.addColorStop(1, 'transparent');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.roundRect(b.x - b.w / 2, b.y - b.h, b.w, b.h, b.w / 2);
                ctx.fill();
                ctx.restore();
            });

            // Laser beam
            if (laserActive) {
                ctx.save();
                ctx.shadowColor = 'rgba(0,255,231,0.9)'; ctx.shadowBlur = 25;
                const laserGrad = ctx.createLinearGradient(ship.x, ship.y, ship.x, 0);
                laserGrad.addColorStop(0, 'rgba(0,255,231,0.9)');
                laserGrad.addColorStop(1, 'rgba(0,255,231,0.05)');
                ctx.strokeStyle = laserGrad; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.moveTo(ship.x, ship.y - 22); ctx.lineTo(ship.x, 0); ctx.stroke();
                ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                ctx.beginPath(); ctx.moveTo(ship.x, ship.y - 22); ctx.lineTo(ship.x, 0); ctx.stroke();
                ctx.restore();
            }

            // Particles
            particles.forEach(p => {
                ctx.save(); ctx.globalAlpha = p.alpha;
                ctx.shadowColor = p.color; ctx.shadowBlur = 6;
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            });

            // Shield
            if (shieldActive) {
                ctx.save();
                const pulse = 0.5 + Math.sin(frame * 0.15) * 0.2;
                ctx.shadowColor = `rgba(0,255,231,${pulse})`; ctx.shadowBlur = 20;
                ctx.strokeStyle = `rgba(0,255,231,${0.6 + pulse * 0.3})`; ctx.lineWidth = 2.5;
                ctx.beginPath(); ctx.arc(ship.x, ship.y, 44, 0, Math.PI * 2); ctx.stroke();
                ctx.fillStyle = `rgba(0,255,231,0.05)`;
                ctx.beginPath(); ctx.arc(ship.x, ship.y, 44, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }

            // Powerups
            powerups.forEach(p => {
                ctx.save();
                ctx.translate(p.x, p.y);
                const pulse = 0.8 + Math.sin(frame * 0.1) * 0.2;
                ctx.shadowColor = p.color; ctx.shadowBlur = 15 * pulse;
                ctx.fillStyle = `rgba(1,1,15,0.8)`;
                ctx.strokeStyle = p.color; ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, 16, 0, Math.PI * 2);
                ctx.fill(); ctx.stroke();
                ctx.shadowBlur = 0;
                
                // rotating inner highlight
                ctx.rotate(p.rot);
                ctx.strokeStyle = p.color; ctx.lineWidth = 1.5; ctx.setLineDash([10, 10]);
                ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.stroke();
                ctx.setLineDash([]);
                ctx.rotate(-p.rot);

                ctx.font = '14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(p.icon, 0, 1);
                ctx.restore();
            });

            // Floating Texts
            floatingTexts.forEach(ft => {
                ctx.save();
                ctx.globalAlpha = ft.alpha;
                ctx.shadowColor = ft.color; ctx.shadowBlur = 14;
                ctx.fillStyle = ft.color;
                const fs = ft.size || 12;
                ctx.font = `bold ${fs}px "Space Mono", monospace`;
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            });

            // Ship (with invulnerability flicker)
            const showShip = invulTimer <= 0 || frame % 6 < 4;
            if (showShip) drawShip(ship.x, ship.y, 1, invulTimer > 0 ? 0.5 : 1);

            // Crosshair at mouse position
            if (mouseX > 0 && mouseY > 0) {
                ctx.save(); ctx.strokeStyle = 'rgba(0,255,231,0.4)'; ctx.lineWidth = 1;
                ctx.setLineDash([4, 4]);
                const cx = mouseX, cy = mouseY, cs = 10;
                ctx.beginPath(); ctx.moveTo(cx - cs, cy); ctx.lineTo(cx + cs, cy); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx, cy - cs); ctx.lineTo(cx, cy + cs); ctx.stroke();
                ctx.setLineDash([]);
                ctx.strokeStyle = 'rgba(0,255,231,0.25)';
                ctx.beginPath(); ctx.arc(cx, cy, 16, 0, Math.PI * 2); ctx.stroke();
                ctx.restore();
            }

            // Vignette
            const vig = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.8);
            vig.addColorStop(0, 'transparent'); vig.addColorStop(1, 'rgba(0,0,5,0.5)');
            ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);
        }

        // ===== END GAME =====
        function endGame() {
            running = false;
            const isNew = score > bestScore;
            if (isNew) { bestScore = score; document.getElementById('best').textContent = bestScore; }
            // Update overlay
            document.getElementById('oIcon').textContent = isNew ? '🏆' : '💥';
            document.getElementById('oTitle').textContent = isNew ? 'REKOR BARU!' : 'GAME OVER';
            document.getElementById('oScore').innerHTML = isNew ? 'High score baru! Luar biasa!' : 'Galaksi membutuhkanmu kembali...';
            // Show stat cards
            document.getElementById('oStats').style.display = 'flex';
            document.getElementById('oStatScore').textContent = score;
            document.getElementById('oStatLevel').textContent = level;
            document.getElementById('oBtn').textContent = 'MAIN LAGI';
            document.getElementById('oHint').textContent = isNew ? '★ NEW HIGH SCORE ★' : 'WASD · MOUSE · AUTO-FIRE';
            overlay.classList.add('show');
            saveScore(score);
        }

        // ===== INPUT =====
        document.addEventListener('keydown', e => {
            keys[e.key] = true;
            if (e.key === 'x' || e.key === 'X') useBomb();
            if (e.key === 'z' || e.key === 'Z') useShield();
            if (e.key === 'c' || e.key === 'C') useLaser();
        });
        document.addEventListener('keyup', e => keys[e.key] = false);

        cvs.addEventListener('mousemove', e => {
            const r = cvs.getBoundingClientRect();
            const scaleX = W / r.width, scaleY = H / r.height;
            mouseX = (e.clientX - r.left) * scaleX;
            mouseY = (e.clientY - r.top) * scaleY;
        });
        cvs.addEventListener('mouseleave', () => { mouseX = -999; mouseY = -999; });

        cvs.addEventListener('touchmove', e => {
            e.preventDefault();
            const r = cvs.getBoundingClientRect();
            const scaleX = W / r.width, scaleY = H / r.height;
            mouseX = (e.touches[0].clientX - r.left) * scaleX;
            mouseY = (e.touches[0].clientY - r.top) * scaleY;
        }, { passive: false });

        // Touch abilities
        let touchStartX = 0, touchStartY = 0;
        cvs.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });
        cvs.addEventListener('touchend', e => {
            const dx = Math.abs(e.changedTouches[0].clientX - touchStartX);
            const dy = Math.abs(e.changedTouches[0].clientY - touchStartY);
            if (dx < 10 && dy < 10) useBomb(); // tap = bomb
        });

        // ===== SAVE =====
        function saveScore(s) {
            try {
                const d = JSON.parse(localStorage.getItem('arcadeNexusStats') || '{"totalScore":0,"gamesPlayed":0,"streak":0,"highScores":{},"achievements":[]}');
                d.totalScore = (d.totalScore || 0) + s; d.gamesPlayed = (d.gamesPlayed || 0) + 1;
                const t = new Date().toDateString();
                if (d.lastPlayed !== t) d.streak = 1; d.lastPlayed = t;
                if (!d.highScores.spaceshooter || s > d.highScores.spaceshooter) d.highScores.spaceshooter = s;
                localStorage.setItem('arcadeNexusStats', JSON.stringify(d));
            } catch (e) { }
        }

        // Init static frame
        draw();
    </script>
    <script src="sounds.js"></script>
    <script src="mobile-touch.js"></script>
</body>
