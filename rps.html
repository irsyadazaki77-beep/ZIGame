<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPS Showdown | ZI GAME</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --cyan: #00ffe7; --pink: #ff2d78; --purple: #b537f2;
            --gold: #ffe600; --green: #00e676; --bg: #02020f;
        }
        body {
            background: var(--bg); color: #fff;
            font-family: 'Outfit', sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden;
        }

        .bg-layer { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .bg-grid {
            position: absolute; inset: 0;
            background-image: linear-gradient(rgba(0,255,231,.022) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,231,.022) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        .orb { position: absolute; border-radius: 50%; filter: blur(120px); }
        .o1 { width:500px;height:500px;top:-20%;left:-10%;background:radial-gradient(circle,rgba(181,55,242,.09),transparent 70%); }
        .o2 { width:450px;height:450px;bottom:-15%;right:-10%;background:radial-gradient(circle,rgba(255,45,120,.09),transparent 70%); }

        .back-btn {
            position: fixed; top:20px; left:20px; z-index:100;
            text-decoration: none;
            font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1px;
            color: rgba(255,255,255,.4);
            border: 1px solid rgba(255,255,255,.1);
            padding: 7px 14px; border-radius: 10px; transition: all .2s;
        }
        .back-btn:hover { color: var(--cyan); border-color: rgba(0,255,231,.3); }

        /* Game wrapper */
        .game-wrap {
            position: relative; z-index: 1;
            width: min(440px, 96vw);
            display: flex; flex-direction: column; align-items: center; gap: 16px;
        }

        /* Title */
        .game-title {
            font-family: 'Bebas Neue', cursive; font-size: clamp(30px,7vw,48px);
            letter-spacing: 3px; text-align: center;
            background: linear-gradient(135deg, var(--pink), var(--purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .game-sub {
            font-family: 'JetBrains Mono', monospace; font-size: 11px;
            color: rgba(255,255,255,.3); letter-spacing: 2px; text-align: center;
            margin-top: -12px;
        }

        /* Scoreboard */
        .scoreboard {
            display: grid; grid-template-columns: 1fr auto 1fr;
            align-items: center; gap: 16px; width: 100%;
            background: rgba(255,255,255,.03);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 20px; padding: 16px 20px;
        }
        .score-panel { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .score-lbl {
            font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 3px;
            text-transform: uppercase;
        }
        .score-lbl.you { color: var(--cyan); }
        .score-lbl.ai  { color: var(--pink); }
        .score-num {
            font-family: 'Bebas Neue', cursive; font-size: 48px; line-height: 1;
            transition: transform .2s cubic-bezier(.34,1.56,.64,1);
        }
        .score-num.you { color: var(--cyan); text-shadow: 0 0 24px rgba(0,255,231,.5); }
        .score-num.ai  { color: var(--pink); text-shadow: 0 0 24px rgba(255,45,120,.5); }
        .score-num.pop { transform: scale(1.4); }
        .score-divider {
            font-family: 'JetBrains Mono', monospace; font-size: 22px;
            color: rgba(255,255,255,.12);
        }

        /* Battle arena */
        .arena {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%;
            background: rgba(255,255,255,.025);
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 20px; padding: 20px;
            min-height: 106px;
        }
        .fighter {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            flex: 1;
        }
        .fighter-emoji {
            font-size: clamp(44px,12vw,60px); line-height: 1;
            transition: transform .3s cubic-bezier(.34,1.56,.64,1), filter .3s;
        }
        .fighter-emoji.animate { animation: emojiPop .4s cubic-bezier(.34,1.56,.64,1); }
        @keyframes emojiPop { 0%{transform:scale(.5) rotate(-15deg)} 60%{transform:scale(1.2) rotate(5deg)} 100%{transform:scale(1) rotate(0)} }
        .fighter-label {
            font-family: 'JetBrains Mono', monospace; font-size: 9px;
            letter-spacing: 2px; opacity: .4;
        }
        .vs-badge {
            font-family: 'Bebas Neue', cursive; font-size: 28px; letter-spacing: 2px;
            color: rgba(255,255,255,.15); flex-shrink: 0; padding: 0 12px;
        }

        /* Result text */
        .result-banner {
            font-family: 'Bebas Neue', cursive; font-size: clamp(26px,6vw,38px);
            letter-spacing: 3px; text-align: center; min-height: 44px;
            transition: all .3s;
        }
        .result-banner.win { color: var(--cyan); text-shadow: 0 0 20px rgba(0,255,231,.5); }
        .result-banner.lose { color: var(--pink); text-shadow: 0 0 20px rgba(255,45,120,.4); }
        .result-banner.draw { color: var(--gold); text-shadow: 0 0 20px rgba(255,230,0,.4); }

        /* Choice buttons */
        .choices {
            display: flex; gap: 12px; justify-content: center; width: 100%;
        }
        .choice-btn {
            flex: 1; padding: 18px 8px;
            border-radius: 20px; border: 2px solid;
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            cursor: pointer; transition: all .2s cubic-bezier(.34,1.56,.64,1);
            background: rgba(0,0,0,.2);
            font-family: 'JetBrains Mono', monospace; font-size: 9px;
            letter-spacing: 2px; text-transform: uppercase;
        }
        .choice-btn .btn-emoji { font-size: clamp(32px,9vw,44px); line-height: 1; }
        .choice-btn.batu   { color: var(--cyan);   border-color: rgba(0,255,231,.3);  }
        .choice-btn.gunting{ color: var(--pink);   border-color: rgba(255,45,120,.3); }
        .choice-btn.kertas { color: var(--purple); border-color: rgba(181,55,242,.3); }
        .choice-btn:hover  { transform: translateY(-6px); box-shadow: 0 12px 30px rgba(0,0,0,.5); }
        .choice-btn.batu:hover    { background: rgba(0,255,231,.08);  box-shadow: 0 12px 30px rgba(0,255,231,.2); }
        .choice-btn.gunting:hover { background: rgba(255,45,120,.08); box-shadow: 0 12px 30px rgba(255,45,120,.2); }
        .choice-btn.kertas:hover  { background: rgba(181,55,242,.08); box-shadow: 0 12px 30px rgba(181,55,242,.2); }
        .choice-btn:active { transform: scale(.94) translateY(0); }

        /* Streak */
        .streak-row {
            display: flex; gap: 8px; justify-content: center; align-items: center;
            font-family: 'JetBrains Mono', monospace; font-size: 10px;
            color: rgba(255,255,255,.3); letter-spacing: 2px;
        }
        .streak-badge {
            padding: 4px 14px; border-radius: 50px;
            background: rgba(255,230,0,.1);
            border: 1px solid rgba(255,230,0,.25);
            color: var(--gold); font-family: 'Bebas Neue', cursive;
            font-size: 14px; letter-spacing: 1px;
            opacity: 0; transition: opacity .3s;
        }
        .streak-badge.show { opacity: 1; }
    </style>
</head>
<body>

    <div class="bg-layer">
        <div class="bg-grid"></div>
        <div class="orb o1"></div>
        <div class="orb o2"></div>
    </div>

    <a href="index.html" class="back-btn">← BACK</a>

    <div class="game-wrap">
        <div>
            <div class="game-title">✊ RPS Showdown ✌️</div>
            <div class="game-sub">Rock · Paper · Scissors</div>
        </div>

        <!-- Scoreboard -->
        <div class="scoreboard">
            <div class="score-panel">
                <span class="score-lbl you">KAMU</span>
                <span class="score-num you" id="pScore">0</span>
            </div>
            <span class="score-divider">:</span>
            <div class="score-panel">
                <span class="score-num ai" id="aScore">0</span>
                <span class="score-lbl ai">AI</span>
            </div>
        </div>

        <!-- Battle arena -->
        <div class="arena">
            <div class="fighter">
                <div class="fighter-emoji" id="playerEmoji">❓</div>
                <div class="fighter-label">KAMU</div>
            </div>
            <div class="vs-badge">VS</div>
            <div class="fighter">
                <div class="fighter-emoji" id="aiEmoji">❓</div>
                <div class="fighter-label">AI</div>
            </div>
        </div>

        <!-- Result -->
        <div class="result-banner" id="resultBanner">Pilih senjatamu!</div>

        <!-- Streak -->
        <div class="streak-row">
            <span>STREAK</span>
            <span class="streak-badge" id="streakBadge">🔥 0</span>
        </div>

        <!-- Choices -->
        <div class="choices">
            <button class="choice-btn batu"    onclick="play('batu')">
                <span class="btn-emoji">✊</span>BATU
            </button>
            <button class="choice-btn gunting" onclick="play('gunting')">
                <span class="btn-emoji">✌️</span>GUNTING
            </button>
            <button class="choice-btn kertas"  onclick="play('kertas')">
                <span class="btn-emoji">✋</span>KERTAS
            </button>
        </div>
    </div>

    <script>
    const CHOICES = ['batu', 'gunting', 'kertas'];
    const EMOJIS  = { batu: '✊', gunting: '✌️', kertas: '✋' };
    const BEATS   = { batu: 'gunting', gunting: 'kertas', kertas: 'batu' };

    let pScore = 0, aScore = 0, streak = 0;

    function play(pChoice) {
        const aChoice = CHOICES[Math.floor(Math.random() * 3)];

        // Animate emojis
        const pe = document.getElementById('playerEmoji');
        const ae = document.getElementById('aiEmoji');
        pe.classList.remove('animate'); ae.classList.remove('animate');
        void pe.offsetWidth; // reflow
        pe.textContent = EMOJIS[pChoice]; pe.classList.add('animate');

        // AI suspense
        ae.textContent = '🎲';
        setTimeout(() => {
            ae.classList.remove('animate');
            void ae.offsetWidth;
            ae.textContent = EMOJIS[aChoice]; ae.classList.add('animate');
        }, 200);

        // Result
        const banner = document.getElementById('resultBanner');
        banner.className = 'result-banner';

        let result;
        if (pChoice === aChoice) {
            result = 'SERI! 🤝'; banner.classList.add('draw');
            streak = 0;
            if (window.SFX) SFX.click();
        } else if (BEATS[pChoice] === aChoice) {
            result = 'KAMU MENANG! ⚡'; banner.classList.add('win');
            pScore++; streak++;
            if (window.SFX) SFX.score();
            animScore('pScore');
        } else {
            result = 'AI MENANG! 💀'; banner.classList.add('lose');
            aScore++; streak = 0;
            if (window.SFX) SFX.hit();
            animScore('aScore');
        }
        banner.textContent = result;

        document.getElementById('pScore').textContent = pScore;
        document.getElementById('aScore').textContent = aScore;

        // Streak
        const sb = document.getElementById('streakBadge');
        if (streak >= 2) {
            sb.textContent = `🔥 ${streak} STREAK`;
            sb.classList.add('show');
        } else {
            sb.classList.remove('show');
        }
    }

    function animScore(id) {
        const el = document.getElementById(id);
        el.classList.add('pop');
        setTimeout(() => el.classList.remove('pop'), 300);
    }
    </script>
    <script src="sounds.js"></script>
    <script src="mobile-touch.js"></script>
</body>
</html>
