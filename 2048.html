<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>2048 Puzzle | ZI GAME</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="game-shared.css">
    <style>
        .grid-2048 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: min(90vw, 520px);
            background: rgba(255, 255, 255, 0.04);
            padding: 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08)
        }

        .tile {
            aspect-ratio: 1;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 900;
            font-size: clamp(20px, 6vw, 32px);
            transition: all 0.15s ease;
            user-select: none
        }

        .tile-0 {
            background: rgba(255, 255, 255, 0.03);
            color: transparent
        }

        .tile-2 {
            background: rgba(0, 242, 254, 0.1);
            color: #00f2fe
        }

        .tile-4 {
            background: rgba(0, 242, 254, 0.18);
            color: #00d4e0
        }

        .tile-8 {
            background: rgba(123, 97, 255, 0.2);
            color: #7b61ff
        }

        .tile-16 {
            background: rgba(123, 97, 255, 0.3);
            color: #a78bfa
        }

        .tile-32 {
            background: rgba(255, 60, 131, 0.2);
            color: #ff3c83
        }

        .tile-64 {
            background: rgba(255, 60, 131, 0.35);
            color: #ff6b9d
        }

        .tile-128 {
            background: rgba(255, 154, 60, 0.25);
            color: #ff9a3c;
            font-size: clamp(18px, 5vw, 28px)
        }

        .tile-256 {
            background: rgba(255, 154, 60, 0.35);
            color: #ffb347;
            font-size: clamp(18px, 5vw, 28px)
        }

        .tile-512 {
            background: rgba(0, 230, 118, 0.25);
            color: #00e676;
            font-size: clamp(18px, 5vw, 28px)
        }

        .tile-1024 {
            background: rgba(0, 230, 118, 0.4);
            color: #69f0ae;
            font-size: clamp(16px, 4.5vw, 24px)
        }

        .tile-2048 {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.4), rgba(123, 97, 255, 0.4));
            color: #fff;
            font-size: clamp(16px, 4.5vw, 24px);
            animation: winGlow 1s infinite alternate;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.4)
        }

        @keyframes winGlow {
            from {
                box-shadow: 0 0 15px rgba(0, 242, 254, 0.3)
            }

            to {
                box-shadow: 0 0 40px rgba(123, 97, 255, 0.5)
            }
        }

        .tile.pop {
            animation: tilePop 0.2s ease
        }

        @keyframes tilePop {
            0% {
                transform: scale(0)
            }

            60% {
                transform: scale(1.15)
            }

            100% {
                transform: scale(1)
            }
        }

        .tile.merge {
            animation: tileMerge 0.25s ease
        }

        @keyframes tileMerge {
            0% {
                transform: scale(1)
            }

            50% {
                transform: scale(1.25)
            }

            100% {
                transform: scale(1)
            }
        }
    </style>
</head>

<body>
    <div class="game-page-bg">
        <div class="orb o1"></div>
        <div class="orb o2"></div>
    </div>
    <div class="game-topbar">
        <a href="index.html" class="back-btn">← Kembali</a>
        <div class="game-page-title">🔢 2048 Puzzle</div>
        <div class="score-display">
            <div class="score-box">Skor: <span id="score">0</span></div>
            <div class="score-box">Best: <span id="best">0</span></div>
        </div>
    </div>
    <div class="game-area" style="position:relative">
        <div class="grid-2048" id="grid"></div>
        <div class="game-overlay" id="overlay">
            <div class="overlay-icon" id="oIcon">🎉</div>
            <div class="overlay-title" id="oTitle">2048!</div>
            <div class="overlay-sub" id="oSub">Skor: 0</div>
            <button class="ctrl-btn primary-btn" onclick="init()">Main Lagi</button>
        </div>
    </div>
    <div class="game-controls">
        <button class="ctrl-btn primary-btn" onclick="init()">🔄 Reset</button>
    </div>
    <script>
        const gridEl = document.getElementById('grid'), overlay = document.getElementById('overlay');
        let grid, score, bestScore = 0, gameOver = false;

        function loadBest() { try { const d = JSON.parse(localStorage.getItem('arcadeNexusStats') || '{}'); bestScore = d.highScores?.puzzle2048 || 0; document.getElementById('best').textContent = bestScore } catch (e) { } }
        loadBest();

        function init() {
            grid = Array(4).fill(null).map(() => Array(4).fill(0));
            score = 0; gameOver = false;
            document.getElementById('score').textContent = 0;
            overlay.classList.remove('active');
            addRandom(); addRandom(); render();
        }

        function addRandom() {
            const empty = [];
            for (let r = 0; r < 4; r++)for (let c = 0; c < 4; c++)if (grid[r][c] === 0) empty.push({ r, c });
            if (!empty.length) return;
            const { r, c } = empty[Math.floor(Math.random() * empty.length)];
            grid[r][c] = Math.random() < 0.9 ? 2 : 4;
        }

        function render() {
            gridEl.innerHTML = '';
            for (let r = 0; r < 4; r++)for (let c = 0; c < 4; c++) {
                const v = grid[r][c]; const t = document.createElement('div');
                const cls = v <= 2048 ? v : 2048;
                t.className = `tile tile-${cls}`; t.textContent = v || '';
                gridEl.appendChild(t);
            }
        }

        function slide(row) {
            let arr = row.filter(v => v);
            let merged = [];
            for (let i = 0; i < arr.length; i++) {
                if (i < arr.length - 1 && arr[i] === arr[i + 1]) {
                    const val = arr[i] * 2; merged.push(val); score += val; i++;
                } else merged.push(arr[i]);
            }
            while (merged.length < 4) merged.push(0);
            return merged;
        }

        function move(dir) {
            if (gameOver) return;
            let moved = false; const prev = JSON.stringify(grid);
            if (dir === 'left') { for (let r = 0; r < 4; r++)grid[r] = slide(grid[r]) }
            else if (dir === 'right') { for (let r = 0; r < 4; r++) { grid[r] = slide(grid[r].reverse()).reverse() } }
            else if (dir === 'up') { for (let c = 0; c < 4; c++) { let col = [grid[0][c], grid[1][c], grid[2][c], grid[3][c]]; col = slide(col); for (let r = 0; r < 4; r++)grid[r][c] = col[r] } }
            else if (dir === 'down') { for (let c = 0; c < 4; c++) { let col = [grid[3][c], grid[2][c], grid[1][c], grid[0][c]]; col = slide(col); for (let r = 0; r < 4; r++)grid[r][c] = col[3 - r] } }

            if (JSON.stringify(grid) !== prev) {
                moved = true; addRandom(); render();
                document.getElementById('score').textContent = score;
                if (score > bestScore) { bestScore = score; document.getElementById('best').textContent = bestScore }
                // Check 2048
                if (grid.some(r => r.some(v => v >= 2048))) { endGame(true) }
                else if (!canMove()) { endGame(false) }
            }
        }

        function canMove() {
            for (let r = 0; r < 4; r++)for (let c = 0; c < 4; c++) {
                if (grid[r][c] === 0) return true;
                if (c < 3 && grid[r][c] === grid[r][c + 1]) return true;
                if (r < 3 && grid[r][c] === grid[r + 1][c]) return true;
            }
            return false;
        }

        function endGame(won) {
            gameOver = true;
            document.getElementById('oIcon').textContent = won ? '🎉' : '😢';
            document.getElementById('oTitle').textContent = won ? '2048 Tercapai!' : 'Game Over!';
            document.getElementById('oSub').textContent = 'Skor: ' + score;
            overlay.classList.add('active');
            saveScore(score);
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') move('left');
            if (e.key === 'ArrowRight') move('right');
            if (e.key === 'ArrowUp') { e.preventDefault(); move('up') }
            if (e.key === 'ArrowDown') { e.preventDefault(); move('down') }
        });

        let tx, ty;
        document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY }, { passive: true });
        document.addEventListener('touchend', e => {
            const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
            if (Math.abs(dx) > Math.abs(dy)) { move(dx > 0 ? 'right' : 'left') } else if (Math.abs(dy) > 30) { move(dy > 0 ? 'down' : 'up') }
        }, { passive: true });

        function saveScore(s) { try { const d = JSON.parse(localStorage.getItem('arcadeNexusStats') || '{"totalScore":0,"gamesPlayed":0,"streak":0,"highScores":{},"achievements":[]}'); d.totalScore += s; d.gamesPlayed++; const t = new Date().toDateString(); if (d.lastPlayed === new Date(Date.now() - 86400000).toDateString()) d.streak = (d.streak || 0) + 1; else if (d.lastPlayed !== t) d.streak = 1; d.lastPlayed = t; if (!d.highScores.puzzle2048 || s > d.highScores.puzzle2048) d.highScores.puzzle2048 = s; localStorage.setItem('arcadeNexusStats', JSON.stringify(d)) } catch (e) { } }

        init();
    </script>
<script src="sounds.js"></script>
    <script src="mobile-touch.js"></script>
</body>

</html>
