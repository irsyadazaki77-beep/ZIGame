<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simon Says | ZI GAME</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --cyan: #00ffe7; --pink: #ff2d78; --purple: #b537f2;
            --gold: #ffe600; --green: #00e676; --bg: #02020f;
        }
        body {
            background: var(--bg); color: #fff;
            font-family: 'Outfit', sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden;
            touch-action: manipulation;
        }

        .bg-layer { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .bg-grid {
            position: absolute; inset: 0;
            background-image: linear-gradient(rgba(0,255,231,.022) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,231,.022) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        .orb { position: absolute; border-radius: 50%; filter: blur(120px); }
        .o1 { width:600px;height:600px;top:-25%;left:-20%;background:radial-gradient(circle,rgba(0,255,231,.07),transparent 70%); }
        .o2 { width:500px;height:500px;bottom:-20%;right:-15%;background:radial-gradient(circle,rgba(255,45,120,.07),transparent 70%); }

        .back-btn {
            position: fixed; top:20px; left:20px; z-index:100;
            text-decoration: none;
            font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1px;
            color: rgba(255,255,255,.4);
            border: 1px solid rgba(255,255,255,.1);
            padding: 7px 14px; border-radius: 10px; transition: all .2s;
        }
        .back-btn:hover { color: var(--cyan); border-color: rgba(0,255,231,.3); }

        /* Game wrapper */
        .game-wrap {
            position: relative; z-index: 1;
            display: flex; flex-direction: column; align-items: center; gap: 16px;
            width: min(400px, 96vw);
        }

        /* Title */
        .game-title {
            font-family: 'Bebas Neue', cursive; font-size: clamp(28px,7vw,44px);
            letter-spacing: 3px; text-align: center;
            background: linear-gradient(135deg, var(--green), var(--cyan));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        /* Stats */
        .stats-row {
            display: flex; gap: 12px; width: 100%; justify-content: center;
        }
        .stat-box {
            flex: 1; text-align: center;
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 14px; padding: 10px 6px;
        }
        .stat-lbl {
            font-family: 'JetBrains Mono', monospace; font-size: 9px;
            letter-spacing: 2px; color: rgba(255,255,255,.3); margin-bottom: 2px;
        }
        .stat-val {
            font-family: 'Bebas Neue', cursive; font-size: 28px; line-height: 1;
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .stat-val.green { background: linear-gradient(135deg, var(--green), var(--cyan));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

        /* Status */
        .status-text {
            font-family: 'JetBrains Mono', monospace; font-size: 12px;
            letter-spacing: 3px; color: rgba(255,255,255,.45);
            text-align: center; text-transform: uppercase;
            min-height: 20px; transition: color .3s;
        }
        .status-text.watch { color: var(--gold); }
        .status-text.go    { color: var(--green); }
        .status-text.fail  { color: var(--pink); }

        /* Simon board */
        .board-wrap {
            position: relative;
            width: min(300px, 80vw); height: min(300px, 80vw);
        }

        /* Center circle */
        .board-center {
            position: absolute;
            width: 28%; height: 28%;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, #111, #06060e);
            border: 2px solid rgba(255,255,255,.1);
            z-index: 10;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Bebas Neue', cursive; font-size: 14px; letter-spacing: 1px;
            color: rgba(255,255,255,.25);
        }

        /* Four quadrant buttons */
        .board {
            width: 100%; height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 8px;
            border-radius: 50%;
            overflow: hidden;
            padding: 0;
        }

        .seg {
            cursor: pointer;
            opacity: .65;
            transition: opacity .12s, filter .12s;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }
        .seg::after {
            content: '';
            position: absolute; inset: 0;
            background: rgba(255,255,255,.12);
            opacity: 0; transition: opacity .12s;
        }
        .seg:hover::after { opacity: 1; }
        .seg.active { opacity: 1; filter: brightness(1.7) saturate(1.4); }
        .seg.active::after { opacity: .4; }

        /* Colors */
        #sg { background: radial-gradient(circle at 30% 30%, #00ff88, #00913a); }
        #sr { background: radial-gradient(circle at 70% 30%, #ff4466, #a00022); }
        #sy { background: radial-gradient(circle at 30% 70%, #ffe600, #a87800); }
        #sb { background: radial-gradient(circle at 70% 70%, #00d4ff, #0060aa); }

        /* Rounded corners for quadrants */
        #sg { border-radius: 100% 8px 8px 8px; }
        #sr { border-radius: 8px 100% 8px 8px; }
        #sy { border-radius: 8px 8px 8px 100%; }
        #sb { border-radius: 8px 8px 100% 8px; }

        /* Overlay */
        .overlay {
            position: fixed; inset: 0; z-index: 200;
            background: rgba(2,2,15,.92); backdrop-filter: blur(20px);
            display: none; flex-direction: column;
            align-items: center; justify-content: center; gap: 18px;
            text-align: center; padding: 20px;
        }
        .overlay.show { display: flex; }
        .ov-icon { font-size: 64px; animation: popIn .5s cubic-bezier(.34,1.56,.64,1) both; }
        .ov-title {
            font-family: 'Bebas Neue', cursive; font-size: clamp(44px,10vw,72px);
            background: linear-gradient(135deg, var(--green), var(--cyan));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .ov-sub { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 2px; color: rgba(255,255,255,.4); }
        .ov-btn {
            margin-top: 4px;
            background: linear-gradient(135deg, var(--green), var(--cyan));
            color: #000; border: none; padding: 13px 40px; border-radius: 50px;
            font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 14px;
            letter-spacing: 1px; cursor: pointer; transition: all .2s;
        }
        .ov-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,230,118,.4); }
        @keyframes popIn { from{transform:scale(.4);opacity:0} to{transform:scale(1);opacity:1} }
    </style>
</head>
<body>

    <div class="bg-layer">
        <div class="bg-grid"></div>
        <div class="orb o1"></div>
        <div class="orb o2"></div>
    </div>

    <a href="index.html" class="back-btn">← BACK</a>

    <div class="overlay show" id="overlay">
        <div class="ov-icon">🎵</div>
        <div class="ov-title">SIMON SAYS</div>
        <div class="ov-sub">Ingat urutan cahaya dan ulangi!</div>
        <button class="ov-btn" onclick="startGame()">MULAI GAME</button>
    </div>

    <div class="game-wrap">
        <div class="game-title">🎵 Simon Says</div>

        <div class="stats-row">
            <div class="stat-box">
                <div class="stat-lbl">Level</div>
                <div class="stat-val" id="levelEl">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-lbl">Best</div>
                <div class="stat-val green" id="bestEl">0</div>
            </div>
        </div>

        <div class="status-text" id="statusEl">Siap bermain?</div>

        <div class="board-wrap">
            <div class="board">
                <div class="seg" id="sg" onmousedown="handle(0)" ontouchstart="handle(0)"></div>
                <div class="seg" id="sr" onmousedown="handle(1)" ontouchstart="handle(1)"></div>
                <div class="seg" id="sy" onmousedown="handle(2)" ontouchstart="handle(2)"></div>
                <div class="seg" id="sb" onmousedown="handle(3)" ontouchstart="handle(3)"></div>
            </div>
            <div class="board-center" id="centerEl">GO!</div>
        </div>
    </div>

    <script>
    const SEGS = [
        document.getElementById('sg'),
        document.getElementById('sr'),
        document.getElementById('sy'),
        document.getElementById('sb'),
    ];
    const COLORS = ['#00e676','#ff2d78','#ffe600','#00d4ff'];

    let seq = [], playerSeq = [], level = 0, playing = false;
    let best = parseInt(localStorage.getItem('simon_best') || '0');
    document.getElementById('bestEl').textContent = best;

    // Web Audio for tones
    const AC = new (window.AudioContext || window.webkitAudioContext)();
    const FREQS = [329.6, 261.6, 392, 523.3]; // E4, C4, G4, C5

    function playTone(idx, dur = 0.28) {
        try {
            const o = AC.createOscillator(), g = AC.createGain();
            o.type = 'sine';
            o.frequency.value = FREQS[idx];
            g.gain.setValueAtTime(0, AC.currentTime);
            g.gain.linearRampToValueAtTime(.35, AC.currentTime + .03);
            g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + dur * .95);
            o.connect(g); g.connect(AC.destination);
            o.start(); o.stop(AC.currentTime + dur);
        } catch(e) {}
    }

    function flash(idx, dur = 300) {
        SEGS[idx].classList.add('active');
        playTone(idx, dur / 1000);
        return new Promise(r => setTimeout(() => { SEGS[idx].classList.remove('active'); r(); }, dur));
    }

    function setStatus(msg, cls = '') {
        const el = document.getElementById('statusEl');
        el.textContent = msg; el.className = 'status-text ' + cls;
        document.getElementById('centerEl').textContent = cls === 'go' ? 'TAP!' : cls === 'watch' ? '👁' : cls === 'fail' ? '💀' : 'GO!';
    }

    function startGame() {
        document.getElementById('overlay').classList.remove('show');
        if (AC.state === 'suspended') AC.resume();
        seq = []; level = 0;
        nextLevel();
    }

    function nextLevel() {
        playerSeq = [];
        level++;
        document.getElementById('levelEl').textContent = level;
        if (level > best) { best = level; localStorage.setItem('simon_best', best); document.getElementById('bestEl').textContent = best; }
        setStatus(`LEVEL ${level} — Perhatikan...`, 'watch');
        seq.push(Math.floor(Math.random() * 4));

        const spd = Math.max(220, 500 - level * 20);
        const gap = Math.max(100, 180 - level * 5);

        setTimeout(async () => {
            playing = false;
            for (const idx of seq) {
                await flash(idx, spd);
                await new Promise(r => setTimeout(r, gap));
            }
            playing = true;
            setStatus('Giliranmu! Ulangi urutan.', 'go');
        }, 900);
    }

    function handle(idx) {
        if (!playing) return;
        flash(idx, 200);
        playerSeq.push(idx);
        const pos = playerSeq.length - 1;

        if (playerSeq[pos] !== seq[pos]) {
            // Wrong!
            playing = false;
            setStatus('SALAH! 💀', 'fail');
            // Flash all red
            SEGS.forEach(s => s.classList.add('active'));
            setTimeout(() => SEGS.forEach(s => s.classList.remove('active')), 400);
            setTimeout(() => {
                document.getElementById('overlay').querySelector('.ov-icon').textContent = '💀';
                document.getElementById('overlay').querySelector('.ov-title').textContent = 'GAME OVER';
                document.getElementById('overlay').querySelector('.ov-sub').textContent = `Sampai level ${level} • Best: ${best}`;
                document.getElementById('overlay').querySelector('.ov-btn').textContent = '↺ Main Lagi';
                document.getElementById('overlay').classList.add('show');
            }, 800);
            if (window.SFX) SFX.gameOver();
            return;
        }

        if (playerSeq.length === seq.length) {
            playing = false;
            setStatus('✅ BENAR!', 'go');
            setTimeout(nextLevel, 900);
            if (window.SFX) SFX.score();
        }
    }

    window.startGame = startGame;
    window.handle = handle;
    </script>
    <script src="sounds.js"></script>
    <script src="mobile-touch.js"></script>
</body>
</html>
