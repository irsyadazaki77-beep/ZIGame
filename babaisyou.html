<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baba Is You Cosmic | ZI GAME</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #90caf9;
            --accent: #ffd54f;
            --danger: #ef5350;
            --tiger-glow: #ff9800;
            --bg-dark: #010208;
            /* Hampir hitam pekat kosmik */
            --glass-bg: rgba(10, 15, 40, 0.7);
            --glass-border: rgba(144, 202, 249, 0.25);
            --tile-size: 40px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        body {
            background: var(--bg-dark);
            color: #e8eaff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 10px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* --- BACKGROUND LUAR ANGKASA REALISTIS --- */
        #space-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            overflow: hidden;
            pointer-events: none;
        }

        /* Variasi Bintang */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle infinite ease-in-out;
        }

        /* Bintang jauh Kecil */
        .star.sm {
            opacity: 0.3;
        }

        /* Bintang Sedang */
        .star.md {
            opacity: 0.6;
            box-shadow: 0 0 2px rgba(255, 255, 255, 0.5);
        }

        /* Bintang Terang Dekat */
        .star.lg {
            opacity: 0.9;
            box-shadow: 0 0 4px rgba(255, 255, 255, 0.8), 0 0 8px rgba(144, 202, 249, 0.6);
            animation: twinkleStrong infinite ease-in-out;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.1;
                transform: scale(0.9);
            }

            50% {
                opacity: 0.7;
                transform: scale(1.1);
            }
        }

        @keyframes twinkleStrong {

            0%,
            100% {
                opacity: 0.4;
                transform: scale(0.8);
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* LOGIKA VISUAL PLANET REALISTIS CSS */
        .planet {
            position: absolute;
            border-radius: 50%;
            /* Asumsi cahaya dari Kiri Atas */
            overflow: hidden;
            /* Potong awan/tekstur di dalam bulatan */
        }

        /* Pseudo-element untuk Tekstur Permukaan & Shading */
        .planet::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: inherit;
            /* Ambil warna dasar planet */
        }

        /* Pseudo-element untuk Bayangan 3D (Core Shading) */
        .planet::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            /* Gradien Radial untuk sisi gelap (gelap di kanan bawah, terang di kiri atas) */
            background: radial-gradient(circle at 30% 30%, transparent 10%, rgba(0, 0, 0, 0.85) 60%, #000 90%);
            box-shadow: inset -10px -10px 20px rgba(0, 0, 0, 0.6);
            /* Tambahan sisi gelap dalam */
            z-index: 2;
            /* Di atas tekstur */
        }

        /* Tekstur Benua/Awan Acak (ditumpuk di antara warna dasar dan shading) */
        .planet-texture {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.4;
            z-index: 1;
        }

        /* Cahaya Atmosfer (Outer Glow) Acak berdasarkan warna planet */
        .planet-glow {
            position: absolute;
            border-radius: 50%;
            z-index: -1;
            /* Di bawah planet */
            filter: blur(10px);
        }

        /* Khusus Planet dengan Cincin (misal p1) */
        .planet-ring {
            position: absolute;
            border-radius: 50%;
            border: 4px solid rgba(200, 200, 200, 0.2);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
            transform: rotateX(75deg) rotateY(10deg);
            /* Efek miring cincin */
            pointer-events: none;
            z-index: -1;
            /* Di belakang shading planet agar tidak menutupi sisi gelap */
        }

        /* --- UI & GAME ELEMENTS (Tetap sama, sedikit penyesuaian warna) --- */
        .header-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(1, 2, 8, 0.95), transparent);
        }

        .btn {
            text-decoration: none;
            color: #e8eaff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            padding: 10px 16px;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(144, 202, 249, 0.3);
        }

        .btn-music {
            color: #81c784;
            border-color: rgba(129, 199, 132, 0.3);
        }

        .btn-action {
            color: #ff8a65;
            border-color: rgba(255, 138, 101, 0.3);
        }

        .game-showcase {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
        }

        .game-title {
            font-family: 'Bebas Neue', cursive;
            font-size: clamp(36px, 8vw, 48px);
            background: linear-gradient(135deg, #90caf9, #ffd54f, #4dd0e1);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .level-indicator {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(12px, 4vw, 16px);
            color: var(--accent);
            margin: 5px 0 15px;
            font-weight: bold;
            background: rgba(255, 213, 79, 0.1);
            padding: 5px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 213, 79, 0.3);
        }

        .game-wrapper {
            background: rgba(5, 8, 25, 0.7);
            border: 2px solid var(--glass-border);
            border-radius: 16px;
            padding: clamp(10px, 3vw, 20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px);
            margin-bottom: 20px;
            animation: fadeInScale 0.6s ease-out;
            position: relative;
        }

        #game-board {
            position: relative;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.4s;
        }

        /* ENTITAS GAME */
        .entity {
            position: absolute;
            width: var(--tile-size);
            height: var(--tile-size);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(var(--tile-size) * 0.7);
            transition: left 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), top 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
            user-select: none;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) backwards;
        }

        .wall {
            background: rgba(44, 51, 80, 0.4);
            border-radius: 4px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8), 0 0 5px rgba(144, 202, 249, 0.2);
            border: 1px solid rgba(144, 202, 249, 0.1);
            width: var(--tile-size);
            height: var(--tile-size);
            font-size: calc(var(--tile-size) * 0.5);
            /* Scale emoji down */
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
        }

        .rock {
            background: radial-gradient(circle, rgba(120, 144, 156, 0.3) 0%, rgba(69, 90, 100, 0.6) 100%);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.2);
            z-index: 2;
            width: calc(var(--tile-size) * 0.9);
            height: calc(var(--tile-size) * 0.9);
            margin: calc(var(--tile-size) * 0.05);
            font-size: calc(var(--tile-size) * 0.6);
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.6));
        }

        .flag {
            z-index: 1;
            animation: float 2s infinite ease-in-out, popIn 0.4s backwards;
            background: radial-gradient(circle, rgba(255, 213, 79, 0.2) 0%, transparent 70%);
            width: calc(var(--tile-size) * 0.8);
            height: calc(var(--tile-size) * 0.8);
            margin: calc(var(--tile-size) * 0.1);
            font-size: calc(var(--tile-size) * 0.6);
            filter: drop-shadow(0 0 15px var(--accent));
        }

        .trap {
            z-index: 1;
            animation: pulseTrap 2s infinite;
            background: radial-gradient(circle, rgba(239, 83, 80, 0.15) 0%, transparent 70%);
            width: calc(var(--tile-size) * 0.9);
            height: calc(var(--tile-size) * 0.9);
            margin: calc(var(--tile-size) * 0.05);
            font-size: calc(var(--tile-size) * 0.6);
            filter: drop-shadow(0 0 10px var(--danger));
        }

        .tiger {
            z-index: 4;
            background: radial-gradient(circle, rgba(216, 67, 21, 0.25) 0%, transparent 80%);
            width: calc(var(--tile-size) * 0.95);
            height: calc(var(--tile-size) * 0.95);
            margin: calc(var(--tile-size) * 0.025);
            border-radius: 50%;
            box-shadow: inset 0 0 20px rgba(216, 67, 21, 0.4);
            font-size: calc(var(--tile-size) * 0.7);
            filter: drop-shadow(0 0 10px var(--tiger-glow));
        }

        .baba {
            z-index: 3;
            background: radial-gradient(circle, rgba(144, 202, 249, 0.3) 0%, transparent 80%);
            width: calc(var(--tile-size) * 0.95);
            height: calc(var(--tile-size) * 0.95);
            margin: calc(var(--tile-size) * 0.025);
            border-radius: 50%;
            box-shadow: inset 0 0 20px rgba(144, 202, 249, 0.5);
            font-size: calc(var(--tile-size) * 0.7);
            filter: drop-shadow(0 0 15px var(--primary));
        }

        .door {
            background: linear-gradient(135deg, #795548, #3e2723);
            border-radius: 4px;
            border: 2px solid #8d6e63;
            width: var(--tile-size);
            height: var(--tile-size);
            font-size: calc(var(--tile-size) * 0.5);
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
            z-index: 1;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
        }

        .key {
            background: radial-gradient(circle, rgba(255, 213, 79, 0.4) 0%, transparent 70%);
            width: calc(var(--tile-size) * 0.8);
            height: calc(var(--tile-size) * 0.8);
            margin: calc(var(--tile-size) * 0.1);
            font-size: calc(var(--tile-size) * 0.6);
            filter: drop-shadow(0 0 15px #ffd54f);
            z-index: 1;
            animation: float 2s infinite;
        }

        .shield {
            background: radial-gradient(circle, rgba(100, 181, 246, 0.4) 0%, transparent 70%);
            width: calc(var(--tile-size) * 0.8);
            height: calc(var(--tile-size) * 0.8);
            margin: calc(var(--tile-size) * 0.1);
            font-size: calc(var(--tile-size) * 0.6);
            filter: drop-shadow(0 0 15px #64b5f6);
            z-index: 1;
            animation: float 2s infinite;
        }

        .player-shielded {
            filter: drop-shadow(0 0 10px #64b5f6) drop-shadow(0 0 20px #64b5f6) !important;
            border: 2px solid #64b5f6 !important;
            box-shadow: inset 0 0 15px rgba(100, 181, 246, 0.8) !important;
        }

        /* PARTICLES */
        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
            mix-blend-mode: screen;
            animation: particleFade 0.6s forwards cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes particleFade {
            0% {
                transform: scale(1) translate(0, 0);
                opacity: 1;
            }

            100% {
                transform: scale(2.5) translate(var(--dx), var(--dy));
                opacity: 0;
            }
        }

        .controls-hint {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: rgba(144, 202, 249, 0.6);
            display: none;
        }

        .d-pad {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        .d-row {
            display: flex;
            gap: 8px;
        }

        .d-btn {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(144, 202, 249, 0.1);
            color: white;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }

        .d-btn:active {
            transform: scale(0.9);
            background: rgba(144, 202, 249, 0.3);
        }

        @media (min-width: 768px) {
            .controls-hint {
                display: block;
            }

            .d-pad {
                display: none;
            }
        }

        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 10, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
            z-index: 10;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-title {
            font-family: 'Bebas Neue', cursive;
            font-size: clamp(32px, 6vw, 42px);
            margin-bottom: 15px;
            letter-spacing: 2px;
            transform: translateY(20px);
            transition: transform 0.4s;
            opacity: 0;
        }

        .modal-overlay.active .modal-title {
            transform: translateY(0);
            opacity: 1;
            transition-delay: 0.1s;
        }

        .modal-title.win {
            color: var(--accent);
            text-shadow: 0 0 20px rgba(255, 213, 79, 0.5);
        }

        .modal-title.lose {
            color: var(--danger);
            text-shadow: 0 0 20px rgba(239, 83, 80, 0.5);
        }

        .next-btn {
            font-family: 'Outfit', sans-serif;
            font-weight: bold;
            font-size: 16px;
            color: #0b0e2a;
            padding: 12px 30px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.4s;
        }

        .next-btn.win-btn {
            background: linear-gradient(135deg, var(--primary), var(--accent));
        }

        .next-btn.lose-btn {
            background: linear-gradient(135deg, #ff8a65, var(--danger));
            color: white;
        }

        .modal-overlay.active .next-btn {
            transform: translateY(0);
            opacity: 1;
            transition-delay: 0.2s;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes popIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes pulseTrap {

            0%,
            100% {
                opacity: 0.8;
            }

            50% {
                opacity: 1;
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        .shake-animation {
            animation: shake 0.3s ease-in-out;
        }
    </style>
</head>

<body>
    <!-- Sound Engine -->
    <script src="sounds.js"></script>

    <div id="space-background"></div>

    <div class="header-bar">
        <a href="index.html" class="btn">← Kembali</a>
        <div class="header-buttons">
            <button class="btn btn-action" onclick="initLevel()">🔄 Ulangi</button>
        </div>
    </div>
    <div class="game-showcase">
        <h1 class="game-title">Baba Is You Cosmic</h1>
        <div class="level-indicator" id="level-text">LEVEL 1</div>
        <div class="game-wrapper" id="game-wrapper">
            <div id="game-board"></div>
            <div class="modal-overlay" id="status-modal">
                <h2 class="modal-title win" id="modal-msg">LEVEL SELESAI!</h2>
                <button class="next-btn win-btn" id="modal-btn" onclick="handleModalClick()">Lanjut >></button>
            </div>
        </div>
        <p class="controls-hint">Gunakan ⬆️⬇️⬅️➡️ atau W A S D untuk bergerak.</p>
        <div class="d-pad">
            <button class="d-btn" onclick="move(0, -1)">⬆️</button>
            <div class="d-row">
                <button class="d-btn" onclick="move(-1, 0)">⬅️</button>
                <button class="d-btn" onclick="move(0, 1)">⬇️</button>
                <button class="d-btn" onclick="move(1, 0)">➡️</button>
            </div>
        </div>
    </div>
    <script>
        let currentLevelIndex = 0;
        let actualTileSize = 40;

        const levels = [
            ["WWWWWWWWWW", "W  W   F W", "W    WW  W", "W  P     W", "W        W", "W   T    W", "W  WWW   W", "W        W", "WWWWWWWWWW"],
            ["WWWWWWWWWW", "W F   W  W", "W  R  W  W", "W W D WWWW", "W T P R KW", "W  R     W", "W W  W   W", "W R     RW", "WWWWWWWWWW"],
            ["WWWWWWWWWWW", "W P   R   W", "W     S   W", "W WWWWWWW W", "W W F   W W", "W W     W W", "W WWWWW W W", "W T       W", "WWWWWWWWWWW"],
            ["WWWWWWWWWW", "W P   S  W", "W XXXXX  W", "W     T  W", "W  XXXXX W", "W R      W", "W XXXXXX W", "W      F W", "WWWWWWWWWW"],
            ["WWWWWWWWWW", "W   T    W", "W  W W   W", "W  R R   W", "W  P W   W", "W        W", "W  XXX   W", "W   F    W", "WWWWWWWWWW"], ["WWWWWWWWWWW", "W P R   T W", "WWWWW WWWWW", "W       R W", "W XXXXXXX W", "W F       W", "WWWWWWWWWWW"], ["WWWWWWWWWW", "W F  W T W", "WWWW W   W", "W    R R W", "W WW W P W", "W XW WWWWW", "W        W", "WWWWWWWWWW"], ["WWWWWWWWWWW", "W F       W", "WWWWWWXXX W", "W P     T W", "W XXXXXWWWW", "W R       W", "WWWWWWWWWWW"], ["WWWWWWWWWW", "W T W F  W", "W R W WW W", "W R   R  W", "W P W R  W", "W   W  R W", "WWWWWWWWWW"], ["WWWWWWWWWW", "W P      W", "W XXX XX W", "W X T  X W", "W X XX X W", "W R    X W", "W XXX XX W", "W F      W", "WWWWWWWWWW"], ["WWWWWWWWWWW", "W P       W", "W WWWWWWW W", "W W F T W W", "W W W R W W", "W W XXXXX W", "W W       W", "W WWWWWWWWW", "W         W", "WWWWWWWWWWW"], ["WWWWWWWWWWW", "W T R P   W", "WWXWWXWWX W", "W       R W", "W XXXXXXX W", "W R   F   W", "WWWWWWWWWWW"], ["WWWWWWWWWW", "W F    R W", "WWWWXWWW W", "W   R  W W", "W W WW W W", "W W  P W W", "W WWXWWW W", "W T      W", "WWWWWWWWWW"], ["WWWWWWWWWWW", "W F X T X W", "W W X   X W", "W R XX XX W", "W X P   X W", "W X R   X W", "W XXXXXXX W", "W         W", "WWWWWWWWWWW"], ["WWWWWWWWWW", "W T W    W", "W   W RR W", "W P W    W", "W   W RR W", "WW WW    W", "W F W  X W", "WWWWWWWWWW"], ["WWWWWWWWWW", "W P      W", "W R WXW  W", "W W T W  W", "W W   W  W", "W WWXWW  W", "W  R R F W", "WWWWWWWWWW"], ["WWWWWWWWWWW", "W F W   T W", "W   X P X W", "WWW W R W W", "W   X   X W", "W R WWWWW W", "W         W", "WWWWWWWWWWW"], ["WWWWWWWWWWWW", "W P R   T  W", "WWWWWWXWWW W", "W        R W", "W WWWWXWWW W", "W R   F    W", "WWWWWWWWWWWW"], ["WWWWWWWWWW", "W T X X  W", "W   X X FW", "WWW X X WW", "W P R R  W", "W X X X  W", "W        W", "WWWWWWWWWW"], ["WWWWWWWWWWWW", "W P R R    W", "WW WW WW W W", "W T  W   W W", "W XX W XXX W", "W  R W  R  W", "WW WWWW WW W", "W          W", "W XXW WXXX W", "W F W W  T W", "WWWWWWWWWWWW"]
        ];

        const boardElement = document.getElementById('game-board');
        const levelTextElement = document.getElementById('level-text');
        const statusModal = document.getElementById('status-modal');
        const modalMsg = document.getElementById('modal-msg');
        const modalBtn = document.getElementById('modal-btn');
        const gameWrapper = document.getElementById('game-wrapper');

        let boardWidth, boardHeight;
        let player = { x: 0, y: 0, element: null };
        let flag = { x: 0, y: 0, element: null };
        let tiger = { x: 0, y: 0, element: null };
        let walls = []; let rocks = []; let traps = [];
        let keys = []; let doors = []; let shields = [];
        let hasKey = false; let hasShield = false;
        let isGameActive = true; let isLevelWon = false;

        function calculateTileSize() {
            if (!levels[currentLevelIndex]) return;
            boardWidth = Math.max(...levels[currentLevelIndex].map(row => row.length));
            const maxAvailableWidth = window.innerWidth - 32;
            const maxAvailableHeight = window.innerHeight - 180;
            const widthBasedSize = maxAvailableWidth / boardWidth;
            const heightBasedSize = maxAvailableHeight / levels[currentLevelIndex].length;
            actualTileSize = Math.floor(Math.min(widthBasedSize, heightBasedSize, 72));
            document.documentElement.style.setProperty('--tile-size', `${actualTileSize}px`);
        }

        function initLevel() {
            statusModal.classList.remove('active'); isGameActive = true; isLevelWon = false; calculateTileSize();
            const mapData = levels[currentLevelIndex]; boardHeight = mapData.length;
            boardElement.style.width = (boardWidth * actualTileSize) + 'px'; boardElement.style.height = (boardHeight * actualTileSize) + 'px';
            levelTextElement.innerText = `LEVEL ${currentLevelIndex + 1} / ${levels.length}`;
            boardElement.innerHTML = ''; walls = []; rocks = []; traps = []; tiger = { x: -1, y: -1, element: null };
            keys = []; doors = []; shields = []; hasKey = false; hasShield = false;
            let animDelay = 0;
            for (let y = 0; y < boardHeight; y++) {
                for (let x = 0; x < mapData[y].length; x++) {
                    const char = mapData[y][x]; let el = null;
                    if (char === 'W') { el = createDOMElement(x, y, '🧱', 'wall'); walls.push({ x, y, element: el }); }
                    else if (char === 'X') { el = createDOMElement(x, y, '💀', 'trap'); traps.push({ x, y, element: el }); }
                    else if (char === 'F') { el = createDOMElement(x, y, '🚩', 'flag'); flag = { x, y, element: el }; }
                    else if (char === 'R') { let rockEl = createDOMElement(x, y, '🪨', 'rock'); rocks.push({ x, y, element: rockEl }); el = rockEl; }
                    else if (char === 'T') { el = createDOMElement(x, y, '🐅', 'tiger'); tiger = { x, y, element: el }; }
                    else if (char === 'P') { el = createDOMElement(x, y, '🐑', 'baba'); player = { x, y, element: el }; }
                    else if (char === 'K') { el = createDOMElement(x, y, '🔑', 'key'); keys.push({ x, y, element: el }); }
                    else if (char === 'D') { el = createDOMElement(x, y, '🚪', 'door'); doors.push({ x, y, element: el }); }
                    else if (char === 'S') { el = createDOMElement(x, y, '🛡️', 'shield'); shields.push({ x, y, element: el }); }
                    if (el) { el.style.animationDelay = `${animDelay}ms`; animDelay += 5; }
                }
            }
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = `${(x * actualTileSize) + (actualTileSize / 2)}px`;
                p.style.top = `${(y * actualTileSize) + (actualTileSize / 2)}px`;
                p.style.width = `${Math.random() * 6 + 4}px`;
                p.style.height = p.style.width;
                p.style.background = color || '#fff';
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 20 + 10;
                p.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
                p.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
                boardElement.appendChild(p);
                setTimeout(() => p.remove(), 600);
            }
        }

        function createDOMElement(x, y, icon, className) {
            const el = document.createElement('div'); el.className = `entity ${className}`; el.innerText = icon;
            updateVisualPosition({ element: el, x, y }); boardElement.appendChild(el); return el;
        }

        function updateVisualPosition(entity) {
            if (!entity || !entity.element) return;
            entity.element.style.left = `${entity.x * actualTileSize}px`; entity.element.style.top = `${entity.y * actualTileSize}px`;
        }

        function isWall(x, y) { return walls.some(w => w.x === x && w.y === y) || doors.some(d => d.x === x && d.y === y); }
        function isTrap(x, y) { return traps.some(t => t.x === x && t.y === y); }
        function getRockAt(x, y) { return rocks.find(r => r.x === x && r.y === y); }

        function move(dx, dy) {
            if (!isGameActive) return;
            const nextX = player.x + dx; const nextY = player.y + dy;
            if (nextX < 0 || nextX >= boardWidth || nextY < 0 || nextY >= boardHeight) return;

            const doorIndex = doors.findIndex(d => d.x === nextX && d.y === nextY);
            if (doorIndex > -1) {
                if (hasKey) {
                    doors[doorIndex].element.remove(); doors.splice(doorIndex, 1);
                    if (window.SFX) SFX.score();
                    createParticles(nextX, nextY, '#deb887');
                } else return;
            } else if (isWall(nextX, nextY)) return;

            if (tiger.element && nextX === tiger.x && nextY === tiger.y) {
                if (hasShield) {
                    hasShield = false; player.element.classList.remove('player-shielded');
                    tiger.element.remove(); tiger.element = null;
                    if (window.SFX) SFX.hit();
                    createParticles(tiger.x, tiger.y, '#64b5f6');
                } else {
                    triggerGameOver("DILAHAP HARIMAU!");
                    createParticles(player.x, player.y, '#ef5350');
                    if (window.SFX) SFX.hit();
                    return;
                }
            }

            const rock = getRockAt(nextX, nextY);
            if (rock) {
                const rockNextX = rock.x + dx; const rockNextY = rock.y + dy;
                if (rockNextX < 0 || rockNextX >= boardWidth || rockNextY < 0 || rockNextY >= boardHeight) return;
                if (isWall(rockNextX, rockNextY) || getRockAt(rockNextX, rockNextY) || isTrap(rockNextX, rockNextY)) return;
                if (tiger.element && rockNextX === tiger.x && rockNextY === tiger.y) return;
                rock.x = rockNextX; rock.y = rockNextY; updateVisualPosition(rock);
                if (window.SFX) SFX.hit();
                createParticles(rock.x, rock.y, '#78909c');
            } else {
                if (window.SFX) SFX.move();
                createParticles(player.x, player.y, 'rgba(144,202,249,0.3)');
            }

            player.x = nextX; player.y = nextY; updateVisualPosition(player);

            const keyIndex = keys.findIndex(k => k.x === player.x && k.y === player.y);
            if (keyIndex > -1) {
                hasKey = true; keys[keyIndex].element.remove(); keys.splice(keyIndex, 1);
                if (window.SFX) SFX.score(); createParticles(player.x, player.y, '#ffd54f');
            }

            const shieldIndex = shields.findIndex(s => s.x === player.x && s.y === player.y);
            if (shieldIndex > -1) {
                hasShield = true; player.element.classList.add('player-shielded');
                shields[shieldIndex].element.remove(); shields.splice(shieldIndex, 1);
                if (window.SFX) SFX.score(); createParticles(player.x, player.y, '#64b5f6');
            }

            if (isTrap(player.x, player.y)) {
                if (hasShield) {
                    hasShield = false; player.element.classList.remove('player-shielded');
                    const tIdx = traps.findIndex(t => t.x === player.x && t.y === player.y);
                    if (tIdx > -1) { traps[tIdx].element.remove(); traps.splice(tIdx, 1); }
                    if (window.SFX) SFX.hit(); createParticles(player.x, player.y, '#64b5f6');
                } else {
                    createParticles(player.x, player.y, '#ef5350');
                    if (window.SFX) SFX.hit();
                    triggerGameOver("OOPS! MATI"); return;
                }
            }

            if (player.x === flag.x && player.y === flag.y) {
                isGameActive = false; isLevelWon = true;
                createParticles(player.x, player.y, '#ffd54f');
                if (window.SFX) { SFX.eat(); setTimeout(SFX.win, 300); }
                setTimeout(() => showModal(currentLevelIndex === levels.length - 1 ? "TAMAT! 🎉" : "LEVEL SELESAI!", currentLevelIndex === levels.length - 1 ? "Main Ulang" : "Lanjut >>", true), 300);
                return;
            }
            if (tiger.element) { setTimeout(() => { moveTiger(); }, 180); }
        }

        function moveTiger() {
            if (!isGameActive || !tiger.element) return;
            let diffX = player.x - tiger.x; let diffY = player.y - tiger.y;
            let nextTigerX = tiger.x; let nextTigerY = tiger.y;
            if (Math.abs(diffX) > Math.abs(diffY)) { nextTigerX += (diffX > 0) ? 1 : -1; }
            else if (Math.abs(diffY) > 0) { nextTigerY += (diffY > 0) ? 1 : -1; }
            if (isWall(nextTigerX, nextTigerY) || isTrap(nextTigerX, nextTigerY)) {
                if (nextTigerX !== tiger.x) { nextTigerX = tiger.x; nextTigerY += (player.y - tiger.y > 0) ? 1 : (player.y - tiger.y < 0 ? -1 : 0); }
                else { nextTigerY = tiger.y; nextTigerX += (player.x - tiger.x > 0) ? 1 : (player.x - tiger.x < 0 ? -1 : 0); }
                if (isWall(nextTigerX, nextTigerY) || isTrap(nextTigerX, nextTigerY)) { nextTigerX = tiger.x; nextTigerY = tiger.y; }
            }
            const rock = getRockAt(nextTigerX, nextTigerY);
            if (rock) {
                const pushDx = nextTigerX - tiger.x; const pushDy = nextTigerY - tiger.y;
                const rockNextX = rock.x + pushDx; const rockNextY = rock.y + pushDy;
                if (rockNextX >= 0 && rockNextX < boardWidth && rockNextY >= 0 && rockNextY < boardHeight && !isWall(rockNextX, rockNextY) && !getRockAt(rockNextX, rockNextY) && !isTrap(rockNextX, rockNextY) && (rockNextX !== player.x || rockNextY !== player.y)) { rock.x = rockNextX; rock.y = rockNextY; updateVisualPosition(rock); }
                else { nextTigerX = tiger.x; nextTigerY = tiger.y; }
            }
            tiger.x = nextTigerX; tiger.y = nextTigerY; updateVisualPosition(tiger);
            if (tiger.x === player.x && tiger.y === player.y) {
                if (hasShield) {
                    hasShield = false; player.element.classList.remove('player-shielded');
                    tiger.element.remove(); tiger.element = null;
                    if (window.SFX) SFX.hit();
                    createParticles(tiger.x, tiger.y, '#64b5f6');
                } else {
                    createParticles(player.x, player.y, '#ff9800');
                    if (window.SFX) SFX.hit();
                    triggerGameOver("TERSANDERA HARIMAU!");
                }
            }
        }

        function triggerGameOver(message) { isGameActive = false; isLevelWon = false; gameWrapper.classList.add('shake-animation'); setTimeout(() => gameWrapper.classList.remove('shake-animation'), 300); if (window.SFX) SFX.gameOver(); setTimeout(() => { showModal(message, "Coba Lagi", false); }, 200); }
        function showModal(message, btnText, isWin) { modalMsg.innerText = message; modalBtn.innerText = btnText; modalMsg.className = isWin ? "modal-title win" : "modal-title lose"; modalBtn.className = isWin ? "next-btn win-btn" : "next-btn lose-btn"; statusModal.classList.add('active'); }
        function handleModalClick() { if (isLevelWon) { if (currentLevelIndex < levels.length - 1) { currentLevelIndex++; } else { currentLevelIndex = 0; } } initLevel(); }
        window.addEventListener('keydown', (e) => { if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.code) > -1) { e.preventDefault(); } switch (e.key) { case 'ArrowUp': case 'w': case 'W': move(0, -1); break; case 'ArrowDown': case 's': case 'S': move(0, 1); break; case 'ArrowLeft': case 'a': case 'A': move(-1, 0); break; case 'ArrowRight': case 'd': case 'D': move(1, 0); break; } });

        // --- MOBILE SWIPE CONTROLS ---
        let touchStartX = 0;
        let touchStartY = 0;
        boardElement.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });
        boardElement.addEventListener('touchend', e => {
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (Math.abs(dx) > 30) move(dx > 0 ? 1 : -1, 0);
            } else {
                if (Math.abs(dy) > 30) move(0, dy > 0 ? 1 : -1);
            }
        }, { passive: true });

        /* --- LOGIKA GENERATOR LUAR ANGKASA DENGAN PLANET REALISTIS --- */
        const spaceContainer = document.getElementById('space-background');

        function generateSpaceBackground() {
            // Generate Stars bervariasi
            const starCount = 180;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                const rand = Math.random();
                let sizeClass = 'sm'; let sizeBase = 1;

                if (rand > 0.95) { sizeClass = 'lg'; sizeBase = 3; }
                else if (rand > 0.7) { sizeClass = 'md'; sizeBase = 2; }

                star.className = `star ${sizeClass}`;
                const size = Math.random() * sizeBase + 1;
                star.style.width = `${size}px`; star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}vw`; star.style.top = `${Math.random() * 100}vh`;
                star.style.animationDelay = `${Math.random() * 5}s`;
                star.style.animationDuration = `${Math.random() * 3 + 3}s`;
                spaceContainer.appendChild(star);
            }

            // Generate Planet REALISTIS (3 Planet Berbeda)
            const planetsData = [
                { id: 'p1', size: 140, x: 75, y: 65, color: '#1a237e', Awans: ['rgba(255,255,255,0.2)', 'rgba(79,195,247,0.3)'], hasRing: true }, // Gas Giant Biru
                { id: 'p2', size: 70, x: 15, y: 20, color: '#bf360c', Awans: ['rgba(255,167,38,0.4)', 'rgba(62,39,35,0.5)'], hasRing: false }, // Planet Terestrial Merah Karat
                { id: 'p3', size: 40, x: 60, y: 15, color: '#827717', Awans: ['rgba(240,244,195,0.3)'], hasRing: false }  // Planet Kecil Beracun
            ];

            planetsData.forEach(p => {
                // Container untuk Glow
                const glow = document.createElement('div');
                glow.className = 'planet-glow';
                glow.style.width = `${p.size + 20}px`; glow.style.height = `${p.size + 20}px`;
                glow.style.left = `${p.x}vw`; glow.style.top = `${p.y}vh`;
                glow.style.background = p.color; glow.style.opacity = 0.3;
                spaceContainer.appendChild(glow);

                // Elemen Planet Utama
                const planet = document.createElement('div');
                planet.className = 'planet'; planet.id = p.id;
                planet.style.width = `${p.size}px`; planet.style.height = `${p.size}px`;
                planet.style.left = `${p.x}vw`; planet.style.top = `${p.y}vh`;
                planet.style.background = p.color; // Warna dasar

                // Menambahkan Tekstur Benua/Awan Acak berlapis
                p.Awans.forEach(awColor => {
                    const txt = document.createElement('div');
                    txt.className = 'planet-texture';
                    // Gunakan gradien radial acak menumpuk untuk tekstur
                    txt.style.background = `radial-gradient(circle at ${Math.random() * 80 + 10}% ${Math.random() * 80 + 10}%, ${awColor} ${Math.random() * 20 + 5}%, transparent ${Math.random() * 50 + 20}%)`;
                    planet.appendChild(txt);
                });
                spaceContainer.appendChild(planet);

                // Tambahkan Cincin jika ada (harus setelah planet agar z-index bekerja benar)
                if (p.hasRing) {
                    const ring = document.createElement('div');
                    ring.className = 'planet-ring';
                    // Ukuran cincin harus lebih besar dari planet
                    const ringSize = p.size * 2.2;
                    ring.style.width = `${ringSize}px`; ring.style.height = `${ringSize / 2}px`; // Elips
                    // Pusatkan cincin ke planet
                    ring.style.left = `${p.x}vw`;
                    ring.style.top = `${p.y}vh`;
                    ring.style.transformOrigin = 'center center';
                    // Koreksi posisi agar pas di tengah planet p1 (hardcoded adjustment sedikit)
                    ring.style.marginLeft = `-${(ringSize - p.size) / 2}px`;
                    ring.style.marginTop = `${p.size / 4}px`;
                    spaceContainer.appendChild(ring);
                }
            });
        }

        window.addEventListener('load', () => { initLevel(); generateSpaceBackground(); });
    </script>
    <script src="mobile-touch.js"></script>
</body>
