<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Memory Match | ZI GAME</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="game-shared.css">
    <style>
        .memory-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: min(90vw, 420px);
            margin: 0 auto
        }

        .mem-card {
            aspect-ratio: 1;
            border-radius: 16px;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)
        }

        .mem-card.flipped,
        .mem-card.matched {
            transform: rotateY(180deg)
        }

        .mem-card.matched {
            pointer-events: none
        }

        .mem-card.matched .mem-front {
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.4);
            border-color: rgba(0, 230, 118, 0.5)
        }

        .mem-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(28px, 8vw, 42px)
        }

        .mem-back {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.1), rgba(123, 97, 255, 0.1));
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 2
        }

        .mem-back::after {
            content: '?';
            font-size: 28px;
            color: rgba(255, 255, 255, 0.3)
        }

        .mem-front {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform: rotateY(180deg)
        }

        .mem-card:hover .mem-back {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.2), rgba(123, 97, 255, 0.2))
        }

        .timer-bar {
            width: min(90vw, 420px);
            height: 6px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 3px;
            margin: 0 auto 20px;
            overflow: hidden
        }

        .timer-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 3px;
            transition: width 1s linear;
            width: 100%
        }

        .stats-row {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
            justify-content: center
        }

        .mini-stat {
            padding: 6px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            align-items: center;
            gap: 6px
        }

        .mini-stat span {
            color: var(--primary);
            font-weight: 700
        }
    </style>
</head>

<body>
    <div class="game-page-bg">
        <div class="orb o1"></div>
        <div class="orb o2"></div>
    </div>
    <div class="game-topbar">
        <a href="index.html" class="back-btn">← Kembali</a>
        <div class="game-page-title">🃏 Memory Match</div>
        <div class="score-display">
            <div class="score-box">Best: <span id="best">-</span></div>
        </div>
    </div>
    <div class="game-area" style="position:relative">
        <div class="stats-row">
            <div class="mini-stat">⏱️ <span id="timeDisplay">60</span>s</div>
            <div class="mini-stat">🔄 <span id="movesDisplay">0</span> langkah</div>
            <div class="mini-stat">✅ <span id="pairsDisplay">0</span>/8</div>
        </div>
        <div class="timer-bar">
            <div class="timer-fill" id="timerFill"></div>
        </div>
        <div class="memory-board" id="board"></div>
        <div class="game-overlay" id="overlay">
            <div class="overlay-icon" id="oIcon">🎉</div>
            <div class="overlay-title" id="oTitle">Menang!</div>
            <div class="overlay-sub" id="oSub">Skor: 0</div>
            <button class="ctrl-btn primary-btn" onclick="startGame()">Main Lagi</button>
        </div>
    </div>
    <div class="game-controls">
        <button class="ctrl-btn primary-btn" onclick="startGame()">🔄 Mulai Ulang</button>
    </div>
    <script>
        const EMOJIS = ['🚀', '🎸', '🌈', '🎯', '🦊', '🍕', '💎', '🔮'];
        const board = document.getElementById('board'), overlay = document.getElementById('overlay');
        let cards = [], flipped = [], matched = 0, moves = 0, timeLeft = 60, timer = null, locked = false;
        let lastTime = 0;

        function loadBest() { try { const d = JSON.parse(localStorage.getItem('arcadeNexusStats') || '{}'); const b = d.highScores?.memory; if (b) document.getElementById('best').textContent = b } catch (e) { } }
        loadBest();

        function startGame() {
            if (timer) cancelAnimationFrame(timer); matched = 0; moves = 0; timeLeft = 60; locked = false; flipped = [];
            document.getElementById('movesDisplay').textContent = 0;
            document.getElementById('pairsDisplay').textContent = '0';
            document.getElementById('timeDisplay').textContent = 60;
            document.getElementById('timerFill').style.width = '100%';
            overlay.classList.remove('active');

            const pairs = [...EMOJIS, ...EMOJIS];
            for (let i = pairs.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[pairs[i], pairs[j]] = [pairs[j], pairs[i]] }

            board.innerHTML = ''; cards = [];
            pairs.forEach((emoji, i) => {
                const card = document.createElement('div'); card.className = 'mem-card'; card.dataset.emoji = emoji; card.dataset.i = i;
                card.innerHTML = `<div class="mem-face mem-back"></div><div class="mem-face mem-front">${emoji}</div>`;
                card.addEventListener('click', () => flipCard(card));
                board.appendChild(card); cards.push(card);
            });

            lastTime = performance.now();
            function tick(timestamp) {
                const dt = (timestamp - lastTime) / 1000;
                if (dt >= 1) {
                    timeLeft--; lastTime += 1000;
                    document.getElementById('timeDisplay').textContent = timeLeft;
                    document.getElementById('timerFill').style.width = (timeLeft / 60 * 100) + '%';
                    if (timeLeft <= 10) document.getElementById('timerFill').style.background = 'linear-gradient(90deg,#ff3c83,#ff6b6b)';
                    if (timeLeft <= 0) { endGame(false); return; }
                }
                timer = requestAnimationFrame(tick);
            }
            timer = requestAnimationFrame(tick);
        }

        function flipCard(card) {
            if (locked || card.classList.contains('flipped') || card.classList.contains('matched')) return;
            card.classList.add('flipped'); flipped.push(card);
            if (flipped.length === 2) {
                moves++; document.getElementById('movesDisplay').textContent = moves; locked = true;
                if (flipped[0].dataset.emoji === flipped[1].dataset.emoji) {
                    flipped.forEach(c => c.classList.add('matched'));
                    matched++; document.getElementById('pairsDisplay').textContent = matched;
                    flipped = []; locked = false;
                    if (matched === 8) endGame(true);
                } else {
                    setTimeout(() => { flipped.forEach(c => c.classList.remove('flipped')); flipped = []; locked = false }, 800);
                }
            }
        }

        function endGame(won) {
            if (timer) cancelAnimationFrame(timer); locked = true;
            const score = won ? Math.max(10, 100 - moves * 2 + timeLeft * 2) : 0;
            document.getElementById('oIcon').textContent = won ? '🎉' : '⏰';
            document.getElementById('oTitle').textContent = won ? 'Selamat!' : 'Waktu Habis!';
            document.getElementById('oSub').textContent = won ? `Skor: ${score} (${moves} langkah, ${timeLeft}s sisa)` : 'Coba lagi!';
            overlay.classList.add('active');
            if (won) saveScore(score);
        }

        function saveScore(s) { try { const d = JSON.parse(localStorage.getItem('arcadeNexusStats') || '{"totalScore":0,"gamesPlayed":0,"streak":0,"highScores":{},"achievements":[]}'); d.totalScore += s; d.gamesPlayed++; const t = new Date().toDateString(); if (d.lastPlayed === new Date(Date.now() - 86400000).toDateString()) d.streak = (d.streak || 0) + 1; else if (d.lastPlayed !== t) d.streak = 1; d.lastPlayed = t; if (!d.highScores.memory || s > d.highScores.memory) d.highScores.memory = s; localStorage.setItem('arcadeNexusStats', JSON.stringify(d)); document.getElementById('best').textContent = d.highScores.memory } catch (e) { } }

        startGame();
    </script>
<script src="sounds.js"></script>
    <script src="mobile-touch.js"></script>
</body>

</html>
